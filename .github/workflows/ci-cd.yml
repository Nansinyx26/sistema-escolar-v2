name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  HAS_SLACK: ${{ secrets.SLACK_WEBHOOK }}
  HAS_RENDER_DEV: ${{ secrets.RENDER_SERVICE_ID_DEV }}
  HAS_RENDER_PROD: ${{ secrets.RENDER_SERVICE_ID_PROD }}
  HAS_RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
  RENDER_SERVICE_ID_DEV: ${{ secrets.RENDER_SERVICE_ID_DEV }}
  RENDER_SERVICE_ID_PROD: ${{ secrets.RENDER_SERVICE_ID_PROD }}
  RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

jobs:
  # ================================
  # LINT & TEST
  # ================================
  lint-and-test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # sharp >=0.35 exige Node >=20.9; vite 8 exige >=20.19
        node-version: [22.x]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          # O lint incremental compara com a branch base; com o clone raso
          # padrão (depth 1) o `--since origin/<base>` não teria o que comparar.
          fetch-depth: 0

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: 📥 Install dependencies (raiz)
        run: npm ci

      - name: 📥 Install dependencies (backend)
        working-directory: ./backend
        run: npm ci

      # Antes este passo era `npm run lint --if-present` no backend. Não existia
      # script `lint` nem configuração de ESLint em lugar nenhum do repositório,
      # então o `--if-present` fazia o passo passar em silêncio: o job se chamava
      # "Lint & Test" e nunca tinha feito lint em nenhum commit. Agora é o Biome,
      # na raiz, cobrindo js/, backend/src/ e portal-responsavel/src/.
      #
      # ESTRATÉGIA DE ADOÇÃO — leia antes de mexer:
      # A primeira execução do Biome neste repositório encontrou 831 erros e 758
      # avisos em 450 arquivos, toda dívida acumulada antes de existir lint.
      # Ligar o gate completo agora reprovaria 100% dos PRs no primeiro dia e o
      # time desligaria o lint — que é o pior desfecho possível.
      #
      # Por isso o gate morde só o CÓDIGO NOVO (arquivos alterados no PR). O
      # relatório completo roda logo abaixo, sem travar, para a dívida ficar
      # visível e ir sendo paga. Quando o total chegar a zero, troque este passo
      # por `npm run lint` e remova o `continue-on-error` do seguinte.
      # Ver a Issue "Adotar Biome como lint e formatação únicos".
      #
      # O gate NÃO roda no PR de release (develop → main). Ali `--since=main`
      # significa "tudo que entrou desde a última publicação", o que traz de
      # volta a dívida legada dos arquivos tocados no caminho — exatamente o
      # que o gate incremental existe para evitar. Cada commit já passou pelo
      # gate ao entrar na develop, um PR por vez; o release só promove o que
      # já foi verificado. Mesma lógica da isenção em pr-policy.yml.
      #
      # `--no-errors-on-unmatched` não é detalhe: sem ele o Biome sai com erro
      # quando NENHUM arquivo casa, e um PR que mexe só em YAML, Markdown ou
      # HTML — nada disso é lintado — reprovaria sem ter nada de errado.
      - name: 🔍 Lint do código alterado (gate)
        if: ${{ !(github.head_ref == 'develop' && github.base_ref == 'main') }}
        run: >-
          npx biome check --changed
          --since="origin/${{ github.base_ref || 'develop' }}"
          --no-errors-on-unmatched

      - name: ⏭️ Gate de lint pulado (PR de release)
        if: ${{ github.head_ref == 'develop' && github.base_ref == 'main' }}
        run: |
          echo "::notice title=Gate de lint pulado::PR de release (develop → main). Cada commit já passou pelo gate ao entrar na develop."

      - name: 📋 Lint completo (relatório da dívida, não bloqueia)
        run: npm run lint
        continue-on-error: true

      # `--runInBand` já vem do script do backend: os testes usam
      # mongodb-memory-server e concorrer entre si dá porta ocupada.
      - name: 🧪 Testes com cobertura
        working-directory: ./backend
        run: npm run test:coverage
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test

      # O passo anterior chamava `npm run coverage`, script que NÃO existe — o
      # nome correto é `test:coverage`. Com `--if-present`, o passo terminava em
      # sucesso sem gerar nada, e o upload abaixo apontava para um lcov.info que
      # nunca foi escrito. Ou seja: a cobertura deste projeto jamais foi medida.
      - name: 🔎 Conferir que o relatório existe
        run: |
          if [ ! -s ./backend/coverage/lcov.info ]; then
            echo "::error title=Cobertura ausente::backend/coverage/lcov.info não foi gerado."
            exit 1
          fi
          echo "lcov.info: $(wc -l < ./backend/coverage/lcov.info) linhas"

      - name: 📤 Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ================================
  # QUALIDADE DE CÓDIGO
  # ================================
  quality:
    name: 🧹 Arquitetura & código morto
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📥 Install dependencies (raiz)
        run: npm ci

      - name: 📥 Install dependencies (backend)
        working-directory: ./backend
        run: npm ci

      # Contrato de camadas: routes → controllers → services → models.
      - name: 🏛️ Contrato de arquitetura (dependency-cruiser)
        run: npm run arch

      # Código, dependências e exports mortos.
      - name: 🗑️ Código morto (Knip)
        run: npm run knip
        continue-on-error: true

  # ================================
  # TESTES END-TO-END
  # ================================
  e2e:
    name: 🎭 E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [lint-and-test]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📥 Install dependencies (raiz)
        run: npm ci

      - name: 📥 Install dependencies (backend)
        working-directory: ./backend
        run: npm ci

      - name: 🎭 Instalar navegadores
        run: npx playwright install --with-deps chromium firefox

      - name: 🎨 Build do CSS
        run: npm run build:css && npm run build:tailwind

      - name: 🎭 Rodar E2E
        run: npm run test:e2e
        env:
          NODE_ENV: test
          CI: "true"
          # Sem Mongo no runner: os testes cobrem páginas públicas e o
          # sistema de motion, que não dependem do banco.
          MONGODB_URI: mongodb://localhost:27017/test
          # JWT_SECRET não é declarado aqui de propósito. Valor fixo dentro do
          # YAML é segredo versionado: o scanner abre incidente a cada push e o
          # alerta de verdade se perde no meio dos falsos positivos.
          # Quem define o segredo é scripts/start-e2e-server.js, que sorteia um
          # valor novo por execução — o backend sobe no mesmo processo, então a
          # variável chega até ele do mesmo jeito.
          OBSERVABILITY_DISABLED: "true"

      - name: 📤 Publicar relatório
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ================================
  # SECURITY SCAN
  # ================================
  security:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Gate de verdade: sem `continue-on-error`. Antes o passo rodava e o
      # resultado era ignorado — "Security Scan" que nunca reprovou nada.
      #
      # O nível é `high`, e não `moderate`, por uma razão concreta: sobra uma
      # vulnerabilidade moderate em `sanitize-html@2.17.1`
      # (GHSA-vccv-cmxp-4j9h, `javascript:` passando por action/formaction/
      # data/poster/background). Ela NÃO é alcançável aqui — `utils/sanitize.js`
      # é o único ponto de uso e roda com `allowedTags: []` e
      # `allowedAttributes: {}`, então nenhum atributo sobrevive à sanitização.
      #
      # A correção seria 2.17.6, que arrasta um htmlparser2 só-ESM e quebra 40
      # suítes sob o runtime CJS do Jest. Trocar um risco não explorável por
      # uma suíte de testes inutilizada é péssimo negócio.
      #
      # Reavalie quando o backend migrar para ESM, ou quando o sanitize-html
      # publicar a correção numa linha CJS.
      - name: 🔐 Dependency Check (npm audit)
        working-directory: ./backend
        run: npm audit --audit-level=high

      # O resultado precisa aparecer no LOG, e não só num arquivo .sarif.
      # Antes, a única saída do Trivy era o arquivo enviado para a aba Security
      # — que neste repositório nunca chegou lá (ver o passo seguinte). Ou seja:
      # o job dizia "Security Scan" e não mostrava nada a ninguém.
      - name: 🔐 Trivy scan (resultado no log)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./backend"
          format: "table"
          severity: "CRITICAL,HIGH"
          # Agora é gate. A triagem que faltava foi feita: `npm audit fix`
          # resolveu as 4 high e 1 moderate das dependências do backend, e a
          # moderate restante (sanitize-html) está justificada no passo acima.
          #
          # Se este passo reprovar por algo que o npm audit não vê, é sinal de
          # achado no sistema de arquivos — imagem base, binário, lockfile de
          # outra linguagem. Trate o achado; não volte o exit-code para 0.
          exit-code: "1"

      - name: 🔐 Trivy scan (arquivo SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./backend"
          format: "sarif"
          output: "trivy-results.sarif"

      # A aba Security só aceita SARIF de repositório PÚBLICO ou de repositório
      # privado com GitHub Advanced Security. Este repo é privado e sem GHAS,
      # então o upload responde "Resource not accessible by integration" —
      # sempre. Como o passo tinha `if: always()` e nada que tolerasse a falha,
      # ele derrubava o job `security`, e com ele o `build-prod`, que declara
      # `needs: [lint-and-test, security]`. Resultado: o deploy de produção era
      # pulado por causa de um upload que nunca poderia funcionar.
      #
      # `continue-on-error` mantém o passo no lugar: no dia em que o repo virar
      # público ou ganhar GHAS, ele volta a publicar sozinho, sem editar nada.
      - name: 📤 Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
        if: always()
        continue-on-error: true

  # ================================
  # BUILD & DEPLOY (DEV)
  # ================================
  build-dev:
    name: 🏗️ Build & Deploy (Dev)
    runs-on: ubuntu-latest
    needs: [lint-and-test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    env:
      HAS_RENDER_DEV: ${{ secrets.RENDER_SERVICE_ID_DEV != '' && secrets.RENDER_API_TOKEN != '' }}
      HAS_SLACK: ${{ secrets.SLACK_WEBHOOK != '' }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📥 Install dependencies
        working-directory: ./backend
        run: npm ci --omit=dev

      - name: 🔨 Build
        working-directory: ./backend
        run: npm run build --if-present

      - name: 📤 Deploy to Render (Dev)
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID_DEV }}
          api-token: ${{ secrets.RENDER_API_TOKEN }}
        if: env.HAS_RENDER_DEV == 'true'

      - name: 📢 Notify on Deploy
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "Dev deployment completed"
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always() && env.HAS_SLACK == 'true'

  # ================================
  # BUILD & DEPLOY (PROD)
  # ================================
  build-prod:
    name: 🚀 Build & Deploy (Production)
    runs-on: ubuntu-latest
    needs: [lint-and-test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # necessário para criar releases (evita "Resource not accessible by integration")
    env:
      HAS_RENDER_PROD: ${{ secrets.RENDER_SERVICE_ID_PROD != '' && secrets.RENDER_API_TOKEN != '' }}
      HAS_SLACK: ${{ secrets.SLACK_WEBHOOK != '' }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📥 Install dependencies
        working-directory: ./backend
        run: npm ci --omit=dev

      - name: 🔨 Build
        working-directory: ./backend
        run: npm run build --if-present

      # Último ponto antes de publicar. Também sem `continue-on-error`: uma
      # auditoria cujo resultado é ignorado na porta da produção é pior que
      # não ter auditoria, porque dá a impressão de que alguém está olhando.
      - name: 🔐 Security audit
        working-directory: ./backend
        run: npm audit --audit-level=high

      - name: 📤 Deploy to Render (Prod)
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID_PROD }}
          api-token: ${{ secrets.RENDER_API_TOKEN }}
        if: env.HAS_RENDER_PROD == 'true'

      - name: 🔔 Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "Production deployment completed"
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always() && env.HAS_SLACK == 'true'

      - name: 📝 Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ================================
  # DATABASE MIGRATIONS
  # ================================
  migrations:
    name: 🗄️ Database Migrations
    runs-on: ubuntu-latest
    needs: build-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    env:
      HAS_SLACK: ${{ secrets.SLACK_WEBHOOK != '' }}
      # Mesmo padrão de HAS_RENDER_DEV/HAS_SLACK: o contexto `secrets` não é
      # acessível no `if` de um job, então a checagem vira env + if de passo.
      HAS_MONGO_DEV: ${{ secrets.MONGODB_URI_DEV != '' }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📥 Install dependencies
        working-directory: ./backend
        run: npm ci

      # `migrate:up` roda o runner versionado (src/database/DatabaseMigrations.js),
      # que registra cada migração aplicada na coleção `__migrations__` e só
      # executa as pendentes — rodar de novo não repete nada.
      #
      # Até a Issue #1, este passo chamava `npm run migrate up`, e o script
      # `migrate` apontava para uma importação ONE-SHOT de IndexedDB. Toda push
      # na develop reimportava aquele dump contra o banco de dev, enquanto as
      # migrações de backend/migrations/ nunca rodavam.
      #
      # A guarda por secret continua: sem MONGODB_URI_DEV o passo é pulado, em
      # vez de derrubar o pipeline com um erro de conexão.
      - name: 🗄️ Run migrations
        working-directory: ./backend
        run: npm run migrate:up
        if: env.HAS_MONGO_DEV == 'true'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI_DEV }}
          NODE_ENV: development

      # Deixa no log o que ficou aplicado — sem isso, migração é uma caixa
      # preta que só se inspeciona conectando no banco à mão.
      - name: 📊 Status das migrations
        working-directory: ./backend
        run: npm run migrate:status
        if: env.HAS_MONGO_DEV == 'true'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI_DEV }}
          NODE_ENV: development

      - name: ⏭️ Migrations puladas
        if: env.HAS_MONGO_DEV != 'true'
        run: |
          echo "::notice title=Migrations puladas::MONGODB_URI_DEV não está configurado."
          echo "Nenhuma migração foi executada. Ver a Issue #1 antes de cadastrar o secret."

      - name: 📢 Notify migration status
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "Database migrations completed"
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always() && env.HAS_SLACK == 'true'

  # ================================
  # PERFORMANCE & LIGHTHOUSE
  # ================================
  performance:
    name: ⚡ Performance Check
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🎨 Lighthouse check
        uses: treosh/lighthouse-ci-action@v10
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true
