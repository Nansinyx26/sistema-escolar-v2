<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Portal do Responsável da Escola Jaguari – acompanhe notas, frequência e notificações do seu filho(a)." />
    <meta name="theme-color" content="#030a0e" />
    <!-- Tema antes da primeira pintura (Issue #436): sem isto a página abre no
         escuro e pisca para o claro quando o React monta. Mesma chave `theme`
         de src/hooks/useTheme.ts. -->
    <script>
      (function () {
        var tema = 'dark';
        try { if (localStorage.getItem('theme') === 'light') tema = 'light'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', tema);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', tema === 'light' ? '#ffffff' : '#030a0e');
      })();
    </script>
    <title>Portal do Responsável – Escola Jaguari</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>" />
    <link rel="manifest" href="./manifest.json" />
    <!-- Rolagem e performance mobile — deve ser o ÚLTIMO stylesheet.
         Servidos de public/ porque a raiz do Vite é portal-responsavel/:
         um caminho ../css/ ficaria fora da raiz e não entraria no build.
         As cópias são atualizadas por `node inject-mobile-scroll.js`. -->
    <link rel="stylesheet" href="./mobile-scroll.css?v=1.0" />
    <script src="./scroll-lock.js?v=1.0"></script>
    <script type="module" crossorigin src="./assets/index-J_cwHogt.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CRqdLXVu.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').then(reg => {
            console.log('SW registrado com sucesso:', reg.scope);
          }).catch(err => {
            console.log('Falha ao registrar SW:', err);
          });
        });
      }
    </script>
    <script src="./click-sound.js" defer></script>
  </body>
</html>
