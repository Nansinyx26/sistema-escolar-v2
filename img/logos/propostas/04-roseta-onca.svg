<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Escola Jaguari — roseta de onça">
  <defs>
    <linearGradient id="o4-fundo" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="o4-centro" x1="200" y1="200" x2="312" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#o4-fundo)"/>
  <!-- Roseta: anel partido em cinco manchas, como na pelagem da onça -->
  <g transform="rotate(-14 256 256) translate(256 256) scale(1 0.92)">
    <circle r="138" stroke="#1c1917" stroke-width="52" stroke-linecap="round" stroke-dasharray="96 77.4"/>
  </g>
  <circle cx="256" cy="256" r="62" fill="url(#o4-centro)"/>
</svg>
