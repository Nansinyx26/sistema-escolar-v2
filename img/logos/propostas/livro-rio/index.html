<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livro e rio — variações</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#f4f4f5; --card:#ffffff; --ink:#0a0a0c; --muted:#52525b; --line:#e4e4e7; --dark:#0a0a0c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter, system-ui, sans-serif; }
  main { max-width:1120px; margin:0 auto; padding:40px 16px 64px; }
  h1 { font-size:28px; margin:0 0 6px; letter-spacing:-0.02em; }
  header p { margin:0 0 32px; color:var(--muted); max-width:62ch; line-height:1.5; }
  .grade { display:grid; gap:20px; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); }
  article { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .palco { display:grid; grid-template-columns:1fr 1fr; }
  .palco > div { display:flex; align-items:center; justify-content:center; gap:12px; padding:20px 8px; }
  .claro { background:#ffffff; }
  .escuro { background:var(--dark); }
  .grande { width:88px; height:88px; }
  .mini { display:flex; flex-direction:column; gap:8px; align-items:center; }
  .mini img:nth-child(1) { width:32px; height:32px; }
  .mini img:nth-child(2) { width:16px; height:16px; }
  .assinatura { display:flex; align-items:center; gap:12px; padding:16px 20px; border-top:1px solid var(--line); }
  .assinatura img { width:44px; height:44px; }
  .assinatura strong { display:block; font-size:17px; letter-spacing:-0.01em; }
  .assinatura span { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; }
  .texto { padding:0 20px 20px; }
  .texto h2 { font-size:16px; margin:0 0 4px; }
  .texto p { margin:0; font-size:14px; color:var(--muted); line-height:1.5; }
  .atual { margin-top:40px; }
  a { color:inherit; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Livro e rio — variações</h1>
    <p>Sete desdobramentos do modelo “Livro e rio”: o conhecimento que flui do livro. O desenho não traz o nome de nenhuma escola, então serve para todas as que usam o sistema. Cada um em fundo claro e escuro, em 88, 32 e 16&nbsp;px. <a href="../index.html">Ver a primeira rodada</a> · Issue #460.</p>
  </header>
  <section class="grade" id="grade"></section>
</main>
<script>
  const modelos = [
    ['l1-original', 'Original', 'O modelo da primeira rodada: livro aberto e três ondas em degradê, num círculo escuro.'],
    ['l2-gradiente', 'Sobre gradiente', 'Livro e ondas em branco sobre o degradê da marca. O mais colorido; bom como ícone de app.'],
    ['l3-nascente', 'Nascente', 'O rio nasce fino na lombada do livro e alarga até a margem. A leitura de “nascente” fica mais direta.'],
    ['l4-amanhecer', 'Amanhecer', 'Um sol nasce atrás do livro, sobre o rio. O mais afetivo, com cara de paisagem do interior.'],
    ['l5-paginas-de-agua', 'Páginas de água', 'As linhas do texto correm como água dentro das páginas. Mais discreto e ainda legível em 16 px.'],
    ['l6-traco', 'Traço', 'Livro e rio só em contorno, sem fundo. Leve; bom para cabeçalho de site e documentos impressos.'],
    ['l7-selo', 'Selo', 'Selo circular com livro e rio no centro e “Sistema Escolar · Portal Educacional”. Para certificados e PDFs.'],
  ];
  document.getElementById('grade').innerHTML = modelos.map(([arq, nome, desc]) => `
    <article>
      <div class="palco">
        <div class="claro"><img class="grande" src="${arq}.svg" alt="${nome}"><div class="mini"><img src="${arq}.svg" alt=""><img src="${arq}.svg" alt=""></div></div>
        <div class="escuro"><img class="grande" src="${arq}.svg" alt=""><div class="mini"><img src="${arq}.svg" alt=""><img src="${arq}.svg" alt=""></div></div>
      </div>
      <div class="assinatura"><img src="${arq}.svg" alt=""><div><strong>Sistema Escolar</strong><span>Portal Educacional</span></div></div>
      <div class="texto"><h2>${nome}</h2><p>${desc}</p></div>
    </article>`).join('');
</script>
</body>
</html>
