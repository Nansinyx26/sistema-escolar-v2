services:
  - type: web
    name: sistema-escolar-backend
    runtime: node
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      # sharp >=0.35 (correção libvips) exige Node >=20.9
      - key: NODE_VERSION
        value: "22"

      # ── Banco de dados ──────────────────────────────────────────────────────
      - key: MONGODB_URI
        sync: false # Configure no painel do Render → Environment
      - key: MONGODB_DB_NAME
        value: test

      # ── Segurança ───────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false # Gere com: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: SESSION_SECRET
        sync: false # Sessão multi-escola (express-session) — gere como o JWT_SECRET
      - key: METRICS_TOKEN
        sync: false # Opcional: protege GET /api/metrics em produção

      # ── Conta administradora (backend/scripts/criar-admin.js) ───────────────
      # Lidas SOMENTE pelo script de provisionamento, nunca pelo servidor.
      # `sync: false` = valor preenchido no painel do Render → Environment; o
      # blueprint versionado fica sem credencial nenhuma.
      #
      # ADMIN_SENHA é opcional: deixe em branco e o script gera uma senha
      # aleatória, exibida uma única vez na saída do comando. Se você preencher,
      # APAGUE a variável do painel logo após rodar o script — senha de admin em
      # texto plano no ambiente do serviço vaza em qualquer dump de env.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
      - key: ADMIN_NOME
        sync: false
      - key: ADMIN_TELEFONE
        sync: false

      # ADMIN_PATH — apelido secreto da área administrativa. Com um valor aqui,
      # as telas passam a responder em /html/<valor>/... e /html/admin/...
      # devolve 404 para todos. Vazio mantém /html/admin.
      # Ofuscação, não autorização: o gate de perfil segue sendo a defesa real.
      # Este é o ÚNICO ADMIN_* que o servidor lê em execução — os demais são
      # usados só pelo script de provisionamento.
      - key: ADMIN_PATH
        sync: false

      # ── URLs ────────────────────────────────────────────────────────────────
      - key: FRONTEND_URL
        value: https://sistema-escolar-bfty.onrender.com

      # ── Google OAuth (login com Google) ─────────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false # Console do Google Cloud → APIs & Services → Credentials

      # ── E-mail (2FA, recuperação de senha e avisos LGPD) ─────────────────────
      # O envio passa por backend/src/services/EnvioEmail.js, que escolhe o
      # transporte pelo FORMATO da chave em EMAIL_PASS:
      #   "re_..."                    → API HTTPS do Resend
      #   "xkeysib-..." / "xsmtpsib-" → API HTTPS do Brevo
      #   qualquer outra + EMAIL_HOST → SMTP
      #
      # PREFIRA UMA CHAVE DE API. O Render bloqueia conexão SMTP de saída, e é
      # por isso que o 2FA de diretor e secretaria parou de chegar: o envio
      # tentava SMTP, era bloqueado, e a falha morria num catch vazio.
      # HTTPS/443 não sofre esse bloqueio.
      - key: EMAIL_USER
        value: resend
      - key: EMAIL_PASS
        sync: false # Chave da API do Resend: https://resend.com/api-keys

      # EMAIL_FROM — OBRIGATÓRIA. Sem ela o código caía em `noreply@escola.com`,
      # um domínio que ninguém verificou; Resend e Brevo RECUSAM a mensagem
      # inteira por causa disso, e a recusa não aparecia em lugar nenhum.
      # Use um endereço de domínio verificado no provedor. Para teste rápido no
      # Resend, `onboarding@resend.dev` funciona sem verificar domínio.
      # Formato aceito: "Sistema Escolar <nao-responda@seudominio.com.br>"
      - key: EMAIL_FROM
        sync: false

      # Configuração de SMTP (EMAIL_HOST/EMAIL_PORT) só é necessária quando
      # EMAIL_PASS NÃO é uma chave de API — o que não é o caso recomendado aqui.
      # As instruções estão em docs/ENVIO-DE-EMAIL.md, fora deste arquivo: um
      # exemplo de host SMTP ao lado de EMAIL_USER e EMAIL_PASS forma o trio
      # host+usuário+senha que os scanners de segredo tratam como credencial
      # vazada — e um falso positivo recorrente treina a equipe a ignorar alerta.

      # ── Política de 2FA ──────────────────────────────────────────────────────
      # DISPENSAR_2FA_EMAIL — perfis que entram SÓ com e-mail e senha.
      # Vazia (padrão) = todos os perfis obrigatórios passam pelo segundo fator.
      #
      #     DISPENSAR_2FA_EMAIL=diretor,secretaria
      #
      # ATENÇÃO: diretor e secretaria enxergam nota, frequência e dado pessoal
      # de menor de idade. Com a dispensa ativa, uma senha vazada vira acesso
      # completo a esses dados, sem nenhuma barreira restante.
      #
      # Existe porque o 2FA depende da entrega de e-mail, e uma indisponibilidade
      # do provedor trancava esses perfis fora do sistema. A alternativa que NÃO
      # abre mão do segundo fator são os códigos de backup:
      #     POST /api/admin/2fa/backup-codes/:usuarioId
      #
      # Apagar esta variável restaura o 2FA na reinicialização seguinte, sem
      # deploy. O boot avisa em nível de alerta enquanto ela estiver ativa, e
      # cada login sem segundo fator entra na auditoria como LOGIN_SEM_2FA.
      - key: DISPENSAR_2FA_EMAIL
        sync: false

      # ── TTS: Google Gemini ───────────────────────────────────────────────────
      - key: GOOGLE_TTS_API_KEY
        sync: false # Google AI Studio: https://aistudio.google.com/app/apikey

      # ── TTS: ElevenLabs (opcional — fallback do Gemini) ──────────────────────
      - key: ELEVENLABS_API_KEY
        sync: false # ElevenLabs: https://elevenlabs.io/app/settings/api-keys

      # ── Copiloto de IA (página ia-assistant) ────────────────────────────────
      # SEM esta chave o assistente responde 503 e a página só mostra o aviso de
      # indisponibilidade. Se ela estiver numa conta de NÍVEL GRATUITO, a cota
      # diária acaba e o assistente passa a responder "atingiu o limite de uso"
      # até a virada do dia — o remédio é ativar faturamento no projeto da
      # chave, não mexer no código.
      - key: GEMINI_KEY
        sync: false # Google AI Studio: https://aistudio.google.com/app/apikey

      # Sobrescreve o modelo tentado primeiro. Em branco usa o padrão do código,
      # que já cai em modelos alternativos quando um deles recusa por cota.
      - key: IA_MODELO
        sync: false

      # ── Chat interno ─────────────────────────────────────────────────────────
      # Adapter compartilhado do Socket.IO. Este serviço roda em `plan: free`,
      # que é UMA instância — nesse cenário o adapter só adicionaria escrita no
      # banco sem benefício, então fica desligado.
      #
      # ATENÇÃO: ao subir de plano e passar a ter mais de uma instância, defina
      # SOCKET_ADAPTER=mongo NO MESMO deploy. Sem isso as salas do Socket.IO
      # ficam presas a cada processo e mensagens, presença e "digitando" param
      # de cruzar entre as instâncias — sem erro visível, só sumindo.
      # - key: SOCKET_ADAPTER
      #   value: mongo

      # Retenção LGPD das conversas (dias). Sem a variável nada expira, que é o
      # padrão: apagar comunicação escolar automaticamente sem a instituição
      # definir o prazo destruiria registro de conselho de classe e ocorrência.
      # Ex.: 730 = 2 anos.
      # - key: CHAT_RETENCAO_DIAS
      #   value: "730"

      # Tetos de uso do chat (opcionais — os padrões do código já valem).
      # - key: RATE_LIMIT_CHAT_MENSAGENS
      #   value: "30"   # mensagens por minuto, por conta
      # - key: RATE_LIMIT_CHAT_UPLOADS
      #   value: "20"   # arquivos por 5 minutos, por conta
      # - key: RATE_LIMIT_CHAT_IP
      #   value: "120"  # mensagens por minuto, por IP
