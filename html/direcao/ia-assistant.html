<!doctype html>
<html lang="pt-br" data-theme="dark">
  <head>
    <!-- Trava de acesso por perfil. SEM defer e antes de tudo: a decisao
         precisa acontecer antes do primeiro pixel. Ver js/guarda-acesso.js. -->
    <script src="/js/guarda-acesso.js?v=1.0"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Assistente da Escola | Portal do Docente</title>

    <!-- Preload da fonte: sem ele o .woff2 só é descoberto depois do CSS. -->
    <link rel="preload" href="../../js/libs/fonts/bootstrap-icons.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../../js/libs/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../../css/responsive-global.css?v=1.2" />

    <style>
      /* ═══════════════════════════════════════════════════════════════
         Copiloto — paleta VERDE INSTITUCIONAL do DESIGN-SYSTEM.md
         (esmeralda #10b981 + teal #0d9488). Sem roxo/neon.
         ═══════════════════════════════════════════════════════════════ */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg: #0b0f0e;
        --surface: #121917;
        --surface2: #18201e;
        --border: rgba(255, 255, 255, 0.08);
        --text: #e6efec;
        --muted: #7d908a;
        --accent: #10b981;
        --accent2: #0d9488;
        --accent3: #6ee7b7;
        --glow: rgba(16, 185, 129, 0.35);
        --glow2: rgba(13, 148, 136, 0.18);
        --erro: #f87171;
        --orb-size: 160px;
        --raio: 14px;
      }

      html, body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
      }

      /* ── Layout ─────────────────────────────────────────────────── */
      .app { display: grid; grid-template-columns: 1fr minmax(420px, 34%); height: 100vh; }

      .stage {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 32px; position: relative; overflow: hidden;
        background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(16, 185, 129, 0.08) 0%, transparent 70%);
      }

      /* ── Orb ────────────────────────────────────────────────────── */
      .orb-wrap { position: relative; display: grid; place-items: center; }

      .orb {
        width: var(--orb-size); height: var(--orb-size); border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, var(--accent3) 0%, var(--accent) 45%, var(--accent2) 100%);
        box-shadow: 0 0 60px var(--glow), inset 0 0 40px rgba(255, 255, 255, 0.12);
        cursor: pointer; transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .orb:hover { transform: scale(1.03); }
      .orb.pensando { animation: pulsar 1.6s ease-in-out infinite; }
      .orb.falando { animation: pulsar 0.8s ease-in-out infinite; }
      /* Captando o microfone: pulso mais rápido que o de "narrando", para os
         dois estados de áudio não ficarem indistinguíveis à distância. */
      .orb.ouvindo { animation: pulsar 0.55s ease-in-out infinite; }

      @keyframes pulsar {
        0%, 100% { transform: scale(1); box-shadow: 0 0 60px var(--glow); }
        50% { transform: scale(1.06); box-shadow: 0 0 90px var(--glow); }
      }

      .ring {
        position: absolute; border: 1px solid var(--glow2); border-radius: 50%;
        pointer-events: none;
      }
      .ring-1 { width: calc(var(--orb-size) * 1.4); height: calc(var(--orb-size) * 1.4); }
      .ring-2 { width: calc(var(--orb-size) * 1.9); height: calc(var(--orb-size) * 1.9); }
      .ring-3 { width: calc(var(--orb-size) * 2.5); height: calc(var(--orb-size) * 2.5); }

      .bars { display: flex; gap: 5px; align-items: flex-end; height: 34px; opacity: 0.25; transition: opacity 0.3s; }
      .bars.active { opacity: 1; }
      .bars .bar { width: 4px; height: 10px; border-radius: 2px; background: var(--accent); }
      .bars.active .bar { animation: onda 0.9s ease-in-out infinite; }
      .bars.active .bar:nth-child(2) { animation-delay: 0.1s; }
      .bars.active .bar:nth-child(3) { animation-delay: 0.2s; }
      .bars.active .bar:nth-child(4) { animation-delay: 0.3s; }
      .bars.active .bar:nth-child(5) { animation-delay: 0.4s; }
      .bars.active .bar:nth-child(6) { animation-delay: 0.5s; }
      .bars.active .bar:nth-child(7) { animation-delay: 0.6s; }
      @keyframes onda { 0%, 100% { height: 10px; } 50% { height: 30px; } }

      .status-pill {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 7px 16px; border-radius: 999px;
        background: var(--surface); border: 1px solid var(--border);
        font-size: 13px; color: var(--muted);
      }
      .status-pill .status-dot {
        width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
      }
      .status-pill.pensando .status-dot,
      .status-pill.ouvindo .status-dot,
      .status-pill.falando .status-dot { background: var(--accent); }

      .stage-btn {
        position: absolute; top: 20px;
        width: 40px; height: 40px; display: grid; place-items: center;
        border-radius: 50%; border: 1px solid var(--border); background: var(--surface);
        color: var(--text); cursor: pointer; text-decoration: none;
        transition: background 0.2s, border-color 0.2s;
      }
      .stage-btn:hover { background: var(--surface2); border-color: var(--accent); }
      .stage-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .back-btn { left: 20px; }
      .gear-btn { right: 20px; }

      /* ── Painel de conversa ─────────────────────────────────────── */
      .chat-panel {
        display: flex; flex-direction: column; height: 100vh;
        background: var(--surface); border-left: 1px solid var(--border);
      }

      /* ── Faixa de estado: "em desenvolvimento" ──────────────────────
         Verde institucional, NÃO vermelho: `--erro` nesta página já
         significa falha de geração (.ia-aviso-erro), e reaproveitar a cor
         faria a faixa ser lida como algo quebrado, e não como um recurso
         em construção.

         Sem animação de entrada, de propósito. A faixa já está na primeira
         pintura da página e reaparece a cada carregamento — animá-la seria
         decoração, não feedback, e cobraria atenção repetida por uma
         informação que não muda. Nada aqui anima, então não há o que
         degradar em `prefers-reduced-motion`.

         `flex-shrink: 0` na coluna do .chat-panel: a faixa reduz a área
         das mensagens (que é `flex: 1`) em vez de espremer a caixa de
         texto ou vazar da tela. */
      .ia-faixa-dev {
        display: flex; align-items: flex-start; gap: 8px; flex-shrink: 0;
        padding: 9px 18px;
        background: rgba(16, 185, 129, 0.08);
        border-bottom: 1px solid rgba(16, 185, 129, 0.22);
        font-size: 12px; line-height: 1.45; color: var(--text);
      }
      .ia-faixa-dev i { flex-shrink: 0; color: var(--accent3); line-height: 1.45; }
      .ia-faixa-dev strong { font-weight: 600; color: var(--accent3); }

      .chat-header {
        display: flex; align-items: center; gap: 12px;
        padding: 16px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
      }
      .chat-header-orb {
        width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
        background: radial-gradient(circle at 35% 30%, var(--accent3), var(--accent2));
      }
      .chat-header-info { flex: 1; min-width: 0; }
      .chat-header-info h1 { font-size: 15px; font-weight: 600; }
      .chat-header-info p {
        font-size: 12px; color: var(--muted);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .header-btn {
        width: 34px; height: 34px; display: grid; place-items: center; flex-shrink: 0;
        border-radius: 9px; border: 1px solid var(--border); background: transparent;
        color: var(--muted); cursor: pointer; transition: color 0.2s, border-color 0.2s;
      }
      .header-btn:hover { color: var(--accent); border-color: var(--accent); }
      .header-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* ── Mensagens ──────────────────────────────────────────────── */
      .messages {
        flex: 1; overflow-y: auto; overscroll-behavior: contain;
        padding: 20px 18px; display: flex; flex-direction: column; gap: 18px;
      }

      .ia-vazio { margin: auto; text-align: center; max-width: 340px; color: var(--muted); }
      .ia-vazio-icone {
        width: 52px; height: 52px; margin: 0 auto 14px; display: grid; place-items: center;
        border-radius: 50%; background: rgba(16, 185, 129, 0.12); color: var(--accent);
      }
      .ia-vazio h2 { font-size: 17px; color: var(--text); margin-bottom: 6px; }
      .ia-vazio p { font-size: 13px; line-height: 1.6; }
      .ia-sugestoes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
      .ia-sugestao {
        padding: 7px 13px; border-radius: 999px; font-size: 12.5px;
        border: 1px solid var(--border); background: var(--surface2);
        color: var(--text); cursor: pointer; transition: border-color 0.2s;
      }
      .ia-sugestao:hover { border-color: var(--accent); }
      .ia-sugestao:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .ia-msg { display: flex; flex-direction: column; max-width: 88%; }
      .ia-msg-usuario { align-self: flex-end; align-items: flex-end; }
      .ia-msg-assistente { align-self: flex-start; align-items: flex-start; max-width: 100%; }

      .ia-bolha {
        padding: 11px 14px; border-radius: var(--raio);
        font-size: 14px; line-height: 1.65; word-wrap: break-word;
      }
      .ia-msg-usuario .ia-bolha {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #04120e; font-weight: 500; border-bottom-right-radius: 4px;
        white-space: pre-wrap;
      }
      .ia-msg-assistente .ia-bolha {
        background: var(--surface2); border: 1px solid var(--border);
        border-bottom-left-radius: 4px; width: 100%;
      }

      .ia-hora { font-size: 10.5px; color: var(--muted); margin-top: 5px; }

      /* ── Markdown ───────────────────────────────────────────────── */
      .ia-markdown > *:first-child { margin-top: 0; }
      .ia-markdown > *:last-child { margin-bottom: 0; }
      .ia-markdown p { margin: 0 0 10px; }
      .ia-markdown h1, .ia-markdown h2, .ia-markdown h3,
      .ia-markdown h4, .ia-markdown h5, .ia-markdown h6 {
        margin: 16px 0 8px; line-height: 1.3; color: var(--accent3);
      }
      .ia-markdown h1 { font-size: 18px; }
      .ia-markdown h2 { font-size: 16px; }
      .ia-markdown h3 { font-size: 14.5px; }
      .ia-markdown h4, .ia-markdown h5, .ia-markdown h6 { font-size: 13.5px; }
      .ia-markdown ul, .ia-markdown ol { margin: 0 0 10px; padding-left: 20px; }
      .ia-markdown li { margin-bottom: 4px; }
      .ia-markdown a { color: var(--accent3); text-decoration: underline; }
      .ia-markdown a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .ia-markdown blockquote {
        margin: 0 0 10px; padding: 6px 12px;
        border-left: 3px solid var(--accent); background: rgba(16, 185, 129, 0.06);
        color: var(--muted);
      }
      .ia-markdown hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
      .ia-markdown code {
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 12.5px; padding: 1px 5px; border-radius: 5px;
        background: rgba(16, 185, 129, 0.12); color: var(--accent3);
      }
      .ia-markdown pre {
        margin: 0 0 10px; padding: 12px 14px; border-radius: 10px;
        background: #0a100e; border: 1px solid var(--border);
        overflow-x: auto; /* o bloco rola em si; a página nunca rola na horizontal */
      }
      .ia-markdown pre code { background: none; padding: 0; color: var(--text); font-size: 12.5px; line-height: 1.55; }

      /* Tabela larga rola dentro do próprio contêiner. */
      .ia-tabela-wrap { overflow-x: auto; margin: 0 0 10px; }
      .ia-markdown table { border-collapse: collapse; width: 100%; font-size: 13px; }
      .ia-markdown th, .ia-markdown td {
        border: 1px solid var(--border); padding: 7px 10px; text-align: left;
      }
      .ia-markdown th { background: rgba(16, 185, 129, 0.1); color: var(--accent3); font-weight: 600; }

      /* ── Estados da resposta ────────────────────────────────────── */
      .ia-pensando { display: flex; gap: 5px; padding: 4px 0; }
      .ia-pensando span {
        width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
        animation: saltar 1.3s ease-in-out infinite;
      }
      .ia-pensando span:nth-child(2) { animation-delay: 0.18s; }
      .ia-pensando span:nth-child(3) { animation-delay: 0.36s; }
      @keyframes saltar { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }

      /* ── Conversas anteriores ───────────────────────────────────── */
      .ia-sidebar {
        flex-shrink: 0; max-height: 42vh; overflow-y: auto;
        border-bottom: 1px solid var(--border); background: var(--bg);
      }
      .ia-sidebar-lista { padding: 8px; display: flex; flex-direction: column; gap: 3px; }
      .ia-sidebar-vazio { padding: 18px 12px; text-align: center; font-size: 12.5px; color: var(--muted); }

      .ia-conversa {
        display: flex; align-items: center; gap: 4px;
        border-radius: 9px; transition: background 0.15s;
      }
      .ia-conversa:hover { background: var(--surface2); }
      .ia-conversa.ativa { background: rgba(16, 185, 129, 0.12); }

      .ia-conversa-abrir {
        flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;
        padding: 8px 10px; border: 0; background: transparent;
        color: var(--text); font-family: inherit; text-align: left; cursor: pointer;
      }
      .ia-conversa-titulo {
        font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .ia-conversa-quando { font-size: 11px; color: var(--muted); }

      .ia-conversa-apagar {
        width: 28px; height: 28px; flex-shrink: 0; margin-right: 6px;
        display: grid; place-items: center;
        border: 0; border-radius: 7px; background: transparent;
        color: var(--muted); cursor: pointer; opacity: 0;
        transition: opacity 0.15s, color 0.15s;
      }
      .ia-conversa:hover .ia-conversa-apagar,
      .ia-conversa-apagar:focus-visible { opacity: 1; }
      .ia-conversa-apagar:hover { color: var(--erro); }
      .ia-conversa-abrir:focus-visible,
      .ia-conversa-apagar:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
      .ia-conversa-apagar i, .ia-conversa-apagar svg { width: 14px; height: 14px; }

      /* ── Paleta de comandos ─────────────────────────────────────── */
      .input-wrap { position: relative; }
      .ia-paleta {
        position: absolute; bottom: calc(100% + 8px); left: 16px; right: 16px;
        z-index: 20; max-height: 260px; overflow-y: auto;
        border-radius: 11px; padding: 5px;
        background: var(--surface2); border: 1px solid var(--border);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      }
      .ia-comando {
        display: flex; align-items: baseline; gap: 10px;
        padding: 8px 10px; border-radius: 8px; cursor: pointer;
      }
      .ia-comando.ativo { background: rgba(16, 185, 129, 0.14); }
      .ia-comando-nome { font-size: 13px; font-weight: 600; color: var(--accent3); flex-shrink: 0; }
      .ia-comando-desc {
        font-size: 12px; color: var(--muted);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }

      /* ── Exportação ─────────────────────────────────────────────── */
      .ia-export-ajuda { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
      .ia-formatos { display: flex; flex-direction: column; gap: 8px; }
      .ia-formato {
        padding: 11px 14px; border-radius: 9px; cursor: pointer; text-align: left;
        background: var(--surface2); border: 1px solid var(--border);
        color: var(--text); font-family: inherit; font-size: 13.5px;
        transition: border-color 0.2s;
      }
      .ia-formato:hover:not(:disabled) { border-color: var(--accent); }
      .ia-formato:disabled { opacity: 0.6; cursor: wait; }
      .ia-formato:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* ── Card de confirmação de ação ────────────────────────────── */
      .ia-confirmacao {
        align-self: flex-start; width: 100%; max-width: 100%;
        margin-top: 2px; padding: 14px;
        border-radius: var(--raio);
        background: var(--surface2);
        /* Borda âmbar: é uma parada deliberada, não mais uma bolha de conversa. */
        border: 1px solid rgba(251, 191, 36, 0.35);
      }
      .ia-confirmacao-cabecalho {
        display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
        font-size: 13.5px; color: #fbbf24;
      }
      .ia-confirmacao-cabecalho i, .ia-confirmacao-cabecalho svg { width: 16px; height: 16px; }
      .ia-confirmacao-resumo { font-size: 14px; line-height: 1.5; margin-bottom: 10px; }

      .ia-confirmacao-dados {
        display: grid; grid-template-columns: auto 1fr; gap: 5px 12px;
        margin-bottom: 14px; padding: 10px 12px;
        border-radius: 9px; background: rgba(0, 0, 0, 0.22);
        font-size: 12.5px;
      }
      .ia-confirmacao-dados dt { color: var(--muted); }
      .ia-confirmacao-dados dd { color: var(--text); word-break: break-word; white-space: pre-wrap; }

      .ia-confirmacao-acoes { display: flex; flex-wrap: wrap; gap: 8px; }
      .ia-confirmacao-acoes button {
        padding: 8px 16px; border-radius: 9px; cursor: pointer;
        font-family: inherit; font-size: 13px; font-weight: 500;
      }
      .ia-confirmacao-acoes button:disabled { opacity: 0.5; cursor: not-allowed; }
      .ia-confirmacao-acoes button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .ia-btn-confirmar {
        border: 0; color: #04120e;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
      }
      .ia-btn-editar, .ia-btn-cancelar {
        background: transparent; border: 1px solid var(--border); color: var(--text);
      }
      .ia-btn-cancelar:hover { border-color: var(--erro); color: var(--erro); }

      /* Estados finais do card */
      .ia-confirmacao-ok {
        border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.08);
      }
      .ia-confirmacao-ok p { color: var(--accent3); font-size: 13.5px; }
      .ia-confirmacao-erro {
        border-color: rgba(248, 113, 113, 0.4); background: rgba(248, 113, 113, 0.08);
      }
      .ia-confirmacao-erro p { color: var(--erro); font-size: 13.5px; }
      .ia-confirmacao-cancelado p { color: var(--muted); font-size: 13.5px; }

      /* Trilha de consultas feitas ao sistema durante a resposta */
      .ia-ferramentas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; }
      .ia-ferramenta {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 3px 10px; border-radius: 999px; font-size: 11.5px;
        background: rgba(16, 185, 129, 0.1); color: var(--accent3);
        border: 1px solid rgba(16, 185, 129, 0.22);
      }
      .ia-ferramenta::before {
        content: ""; width: 5px; height: 5px; border-radius: 50%;
        background: var(--accent); animation: piscar 1.2s ease-in-out infinite;
      }
      /* No histórico a consulta já terminou — o ponto para de piscar. */
      .ia-ferramenta-feita { opacity: 0.7; }
      .ia-ferramenta-feita::before { animation: none; }

      .ia-cursor {
        display: inline-block; width: 7px; height: 14px; margin-left: 2px;
        background: var(--accent); vertical-align: text-bottom;
        animation: piscar 1s step-end infinite;
      }
      @keyframes piscar { 50% { opacity: 0; } }

      .ia-aviso { font-size: 13px; padding: 8px 11px; border-radius: 9px; margin-top: 8px; }
      .ia-aviso-erro { background: rgba(248, 113, 113, 0.12); color: var(--erro); border: 1px solid rgba(248, 113, 113, 0.3); }
      .ia-aviso-info { background: rgba(255, 255, 255, 0.05); color: var(--muted); border: 1px solid var(--border); }
      .ia-sem-resposta { color: var(--muted); font-style: italic; }

      .ia-acoes { display: flex; align-items: center; gap: 4px; margin-top: 7px; }
      .ia-acao {
        width: 27px; height: 27px; display: grid; place-items: center;
        border: 0; border-radius: 7px; background: transparent;
        color: var(--muted); cursor: pointer; transition: color 0.2s, background 0.2s;
      }
      .ia-acao:hover { color: var(--accent); background: rgba(16, 185, 129, 0.1); }
      .ia-acao:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .ia-acao-ok { color: var(--accent); }
      .ia-acao i, .ia-acao svg { width: 15px; height: 15px; }
      .ia-acoes .ia-hora { margin: 0 0 0 auto; }

      /* ── Caixa de entrada ───────────────────────────────────────── */
      .input-wrap {
        display: flex; align-items: flex-end; gap: 9px;
        padding: 14px 16px; border-top: 1px solid var(--border); flex-shrink: 0;
      }
      .input-box {
        flex: 1; resize: none; max-height: 160px;
        padding: 11px 13px; border-radius: 11px;
        background: var(--surface2); border: 1px solid var(--border);
        color: var(--text); font-family: inherit; font-size: 14px; line-height: 1.5;
      }
      .input-box:focus { outline: none; border-color: var(--accent); }
      .input-box:disabled { opacity: 0.55; }
      .input-box::placeholder { color: var(--muted); }

      .send-btn, .stop-btn, .mic-btn {
        width: 42px; height: 42px; flex-shrink: 0; display: grid; place-items: center;
        border: 0; border-radius: 11px; cursor: pointer; transition: all 0.2s;
      }
      .send-btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #04120e; }
      .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .stop-btn { background: rgba(248, 113, 113, 0.15); color: var(--erro); border: 1px solid rgba(248, 113, 113, 0.35); }
      .mic-btn { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
      .mic-btn:hover { border-color: var(--accent); color: var(--accent); }
      .mic-btn.gravando {
        background: rgba(248, 113, 113, 0.2); color: var(--erro); border-color: var(--erro);
        animation: pulse-mic 1.2s infinite;
      }
      @keyframes pulse-mic {
        0%, 100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.4); }
        50% { box-shadow: 0 0 0 8px rgba(248, 113, 113, 0); }
      }
      .send-btn:focus-visible, .stop-btn:focus-visible, .mic-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* ── Painel de voz ──────────────────────────────────────────── */
      .config-overlay {
        position: fixed; inset: 0; z-index: 60; display: none;
        place-items: center; padding: 20px;
        background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px);
      }
      .config-overlay.open { display: grid; }
      .config-box {
        width: 100%; max-width: 380px; padding: 22px;
        border-radius: 16px; background: var(--surface); border: 1px solid var(--border);
      }
      .config-box h2 { font-size: 16px; margin-bottom: 16px; }
      .config-field { margin-bottom: 13px; }
      .config-field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
      .config-field select {
        width: 100%; padding: 9px 11px; border-radius: 9px;
        background: var(--surface2); border: 1px solid var(--border);
        color: var(--text); font-family: inherit; font-size: 13.5px;
      }
      .config-field select:focus { outline: none; border-color: var(--accent); }
      .config-btns { display: flex; gap: 9px; margin-top: 18px; }
      .config-btns button {
        flex: 1; padding: 10px; border-radius: 9px; cursor: pointer;
        font-family: inherit; font-size: 13.5px; font-weight: 500;
      }
      .btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--text); }
      .btn-save { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: 0; color: #04120e; }

      /* ── Toast ──────────────────────────────────────────────────── */
      .toast {
        position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 16px);
        z-index: 70; max-width: min(440px, calc(100vw - 40px));
        padding: 11px 17px; border-radius: 11px; font-size: 13px;
        background: var(--surface2); border: 1px solid var(--border); color: var(--text);
        opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      /* ── Responsivo ─────────────────────────────────────────────── */
      @media (max-width: 1024px) {
        .app { grid-template-columns: 1fr; grid-template-rows: minmax(220px, 30vh) 1fr; }
        .chat-panel { border-left: 0; border-top: 1px solid var(--border); height: auto; min-height: 0; }
        :root { --orb-size: 110px; }
        .ring-3 { display: none; }
      }

      @media (max-width: 640px) {
        .app { grid-template-rows: 0 1fr; }
        /* No celular a tela inteira é a conversa: o orb vira só o cabeçalho. */
        .stage { display: none; }
        .messages { padding: 16px 13px; gap: 15px; }
        .ia-msg { max-width: 94%; }
        .input-wrap { padding: 11px 13px; }
        /* Acompanha o recuo das mensagens; a faixa continua visível, porque
           no celular esta coluna é a tela inteira. */
        .ia-faixa-dev { padding: 8px 13px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .orb, .orb.pensando, .orb.falando, .orb.ouvindo,
        .bars.active .bar, .ia-pensando span, .ia-cursor { animation: none !important; }
        * { transition-duration: 0.01ms !important; }
      }
    </style>

    <link rel="stylesheet" href="../../css/splash-screen.css?v=1.0" />
    <link rel="stylesheet" href="../../css/reactions.css?v=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon-180.png" />
    <meta name="theme-color" content="#0b0f0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Escola" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="../../css/system-global.css?v=1.0" />
    <!-- Rolagem e performance mobile — deve ser o ÚLTIMO stylesheet -->
    <link rel="stylesheet" href="../../css/mobile-scroll.css?v=1.0" />
    <link rel="stylesheet" href="../../css/motion.css">
    <script src="../../js/scroll-lock.js?v=1.0"></script>
  </head>

  <body>
    <!-- Splash Screen (PWA) -->
    <div id="splashScreen">
      <div class="splash-logo-container">
        <div class="splash-logo"><i class="bi bi-mortarboard-fill"></i></div>
        <div class="splash-logo-ring"></div>
      </div>
      <div class="splash-text">
        <h2 class="splash-title">Sistema Escolar</h2>
        <p class="splash-subtitle">Assistente da Escola</p>
      </div>
      <div class="splash-progress-container">
        <div class="splash-progress-track"><div class="splash-progress-bar"></div></div>
        <div class="splash-progress-text">Inicializando sistema...</div>
      </div>
      <div class="splash-version">v3.0</div>
    </div>
    <script src="../../js/splash-screen.js"></script>

    <!-- Preferências de voz -->
    <div class="config-overlay" id="configOverlay" role="dialog" aria-modal="true" aria-labelledby="cfgTitulo">
      <div class="config-box">
        <h2 id="cfgTitulo">Preferências de voz</h2>

        <!-- Os `value` são os nomes que o backend resolve em TTSService
             (ELEVENLABS_VOICES). Antes as opções eram "male"/"off", herdadas do
             Google Cloud: a voz salva nunca reaparecia selecionada aqui, porque
             o valor gravado não existia na lista. -->
        <div class="config-field">
          <label for="cfgVoice">Voz</label>
          <select id="cfgVoice">
            <option value="brian">Brian — grave e tranquila (padrão)</option>
            <option value="adam">Adam — firme</option>
            <option value="eric">Eric — natural</option>
            <option value="george">George — pausada</option>
            <option value="off">Desativada</option>
          </select>
        </div>

        <div class="config-field">
          <label for="cfgAuto">Narração automática</label>
          <select id="cfgAuto">
            <option value="0">Só quando eu clicar em "Ouvir"</option>
            <option value="1">Narrar toda resposta</option>
          </select>
        </div>

        <div class="config-field">
          <label for="cfgLang">Idioma da interação</label>
          <select id="cfgLang">
            <option value="pt-BR">Português (Brasil)</option>
            <option value="en-US">English (US)</option>
            <option value="es-ES">Español</option>
          </select>
        </div>

        <div class="config-field">
          <label for="cfgProvider">Qualidade da narração</label>
          <select id="cfgProvider">
            <option value="auto">Automática (recomendada)</option>
            <option value="elevenlabs">Alta qualidade</option>
            <option value="google-cloud">Padrão</option>
          </select>
        </div>

        <div class="config-btns">
          <button type="button" class="btn-cancel" id="cfgCancel">Cancelar</button>
          <button type="button" class="btn-save" id="cfgSave">Salvar e fechar</button>
        </div>
      </div>
    </div>

    <!-- Escolha do formato de exportação -->
    <div class="config-overlay" id="exportOverlay" role="dialog" aria-modal="true" aria-labelledby="expTitulo">
      <div class="config-box">
        <h2 id="expTitulo">Exportar conversa</h2>
        <p class="ia-export-ajuda">Escolha o formato do arquivo.</p>
        <div class="ia-formatos" id="exportFormatos"></div>
        <div class="config-btns">
          <button type="button" class="btn-cancel" id="expCancel">Fechar</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="app">
      <!-- Painel visual -->
      <div class="stage">
        <!-- href/title são reescritos por perfil em pagina-ia-assistant.js:
             a página é compartilhada por diretor, professor e secretaria. -->
        <a class="stage-btn back-btn" id="backBtn" href="/html/dashboard.html" title="Voltar ao painel" aria-label="Voltar ao painel">
          <i class="bi bi-arrow-left" aria-hidden="true"></i>
        </a>

        <button type="button" class="stage-btn gear-btn" id="gearBtn" title="Preferências de voz" aria-label="Preferências de voz">
          <i class="bi bi-gear" aria-hidden="true"></i>
        </button>

        <div class="orb-wrap">
          <div class="ring ring-1"></div>
          <div class="ring ring-2"></div>
          <div class="ring ring-3"></div>
          <div class="orb" id="orb" role="presentation"></div>
        </div>

        <div class="bars" id="bars" aria-hidden="true">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div>
        </div>

        <div class="status-pill" id="statusPill">
          <div class="status-dot"></div>
          <span id="statusText">Pronto para ajudar</span>
        </div>
      </div>

      <!-- Conversa -->
      <div class="chat-panel">
        <!-- role="note" e não "alert": o aviso é permanente e não decorre de
             nenhuma ação: um live region anunciaria a mesma frase a cada
             carregamento e tiraria o leitor de tela do caminho de quem chegou
             para digitar. Como "note" ele é lido na ordem do documento, antes
             do cabeçalho da conversa. -->
        <div class="ia-faixa-dev" role="note">
          <i class="bi bi-cone-striped" aria-hidden="true"></i>
          <p><strong>Em desenvolvimento.</strong> Respostas geradas por IA podem conter erros — confira antes de decidir.</p>
        </div>

        <header class="chat-header">
          <div class="chat-header-orb" aria-hidden="true"></div>
          <div class="chat-header-info">
            <h1 id="greeting">Assistente da escola</h1>
            <p id="ctxBadge">Carregando contexto...</p>
          </div>
          <button type="button" class="header-btn" id="exportBtn" title="Exportar conversa" aria-label="Exportar conversa">
            <i data-lucide="download" aria-hidden="true"></i>
          </button>
          <button type="button" class="header-btn" id="historyBtn" title="Conversas anteriores" aria-label="Conversas anteriores" aria-expanded="false">
            <i data-lucide="history" aria-hidden="true"></i>
          </button>
          <button type="button" class="header-btn" id="newChatBtn" title="Nova conversa" aria-label="Nova conversa">
            <i data-lucide="plus" aria-hidden="true"></i>
          </button>
        </header>

        <!-- Conversas anteriores. Fica recolhida por padrão: o uso comum é
             continuar conversando, não navegar no histórico. -->
        <nav class="ia-sidebar" id="iaSidebar" hidden aria-label="Conversas anteriores">
          <div class="ia-sidebar-lista" id="iaSidebarLista"></div>
        </nav>

        <!-- aria-live: o texto parcial fica em aria-busy e só é anunciado ao fim -->
        <main class="messages" id="messages" aria-live="polite" aria-label="Conversa com o assistente"></main>

        <div class="input-wrap">
          <label class="sr-only" for="inputBox" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Mensagem para o assistente</label>

          <!-- Paleta de comandos: listbox controlada pela caixa de texto, para
               as setas navegarem sem tirar o foco de quem está digitando. -->
          <div class="ia-paleta" id="iaPaleta" role="listbox" aria-label="Comandos rápidos" hidden></div>

          <textarea class="input-box" id="inputBox" rows="1"
            role="combobox" aria-expanded="false" aria-controls="iaPaleta" aria-autocomplete="list"
            placeholder="Pergunte alguma coisa, ou digite / para os comandos"></textarea>
          <button type="button" class="mic-btn" id="micBtn" title="Falar por voz (Microfone)" aria-label="Falar por voz" aria-pressed="false">
            <i data-lucide="mic" aria-hidden="true"></i>
          </button>
          <button type="button" class="stop-btn" id="stopBtn" hidden title="Parar geração" aria-label="Parar geração">
            <i data-lucide="square" aria-hidden="true"></i>
          </button>
          <button type="button" class="send-btn" id="sendBtn" title="Enviar" aria-label="Enviar mensagem">
            <i data-lucide="send" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Scripts base (clássicos: definem window.API_BASE_URL, db, auth, speak) -->
    <script src="../../js/api-config.js"></script>
    <script src="../../js/database.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/libs/purify.min.js"></script>
    <script src="../../js/sidebar-voice.js?v=4.0"></script>

    <!-- Ícones antes do módulo: pagina-ia-assistant.js chama renderLucideIcons -->
    <script src="../../js/libs/lucide.min.js"></script>
    <script src="../../js/libs/lucide-init.js"></script>

    <!-- Copiloto (ES modules). Módulos são adiados por padrão, então rodam
         depois de todos os scripts clássicos acima. -->
    <script type="module" src="../../js/ia/pagina-ia-assistant.js"></script>

    <script src="../../js/click-sound.js" defer></script>
    <script defer src="../../js/push-notifications.js"></script>
    <script defer src="../../js/pwa-install.js"></script>
    <script defer src="../../js/settings-drawer.js"></script>
    <script defer src="../../js/observability.js"></script>
      <script defer src="../../js/motion.js"></script>
</body>
</html>
