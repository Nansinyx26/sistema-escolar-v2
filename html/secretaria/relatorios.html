<script>
const API = () => window.API_BASE_URL || '/api';
function toast(m,t='success'){const d=document.createElement('div');d.className=`sec-toast sec-toast-${t}`;d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3000);}

document.addEventListener('DOMContentLoaded', async () => {
    if (typeof db !== 'undefined') await db.init();
    if (typeof auth !== 'undefined') await auth.init();
    iniciarFiltros();
    carregarSalas();
    recarregarRelatorios();
});

// ============================================================================
// FILTROS — nome do aluno e sala
// ============================================================================
// Os dois relatórios desta página listavam a escola inteira e não havia como
// procurar um aluno: a secretaria rolava a tela até achar. Agora o filtro vai
// para o SERVIDOR (`?q=` e `?turma=`) em vez de esconder linhas já baixadas —
// filtrar no navegador só funcionaria se tudo coubesse na resposta, e a lista
// de matrículas é paginada justamente por não caber.
// ============================================================================

/** Filtros correntes, na forma em que vão para a querystring. */
function filtrosAtuais() {
    return {
        q: (document.getElementById('filtroAluno')?.value || '').trim(),
        turma: document.getElementById('filtroSala')?.value || '',
    };
}

/** Sufixo de querystring com os filtros ativos (vazio quando não há nenhum). */
function queryDosFiltros(separador = '?') {
    const { q, turma } = filtrosAtuais();
    const partes = [];
    if (q) partes.push('q=' + encodeURIComponent(q));
    if (turma) partes.push('turma=' + encodeURIComponent(turma));
    return partes.length ? separador + partes.join('&') : '';
}

function iniciarFiltros() {
    const campo = document.getElementById('filtroAluno');
    const sala = document.getElementById('filtroSala');
    const limpar = document.getElementById('btnLimparFiltros');

    let timer;
    campo?.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(recarregarRelatorios, 400);
    });
    // Enter recarrega na hora — esperar o debounce depois de um Enter parece
    // que a tela ignorou a busca.
    campo?.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        clearTimeout(timer);
        recarregarRelatorios();
    });
    sala?.addEventListener('change', recarregarRelatorios);
    limpar?.addEventListener('click', () => {
        if (campo) campo.value = '';
        if (sala) sala.value = '';
        recarregarRelatorios();
    });
}

/** Popula o seletor de sala a partir das turmas da escola. */
async function carregarSalas() {
    const select = document.getElementById('filtroSala');
    if (!select) return;
    try {
        const json = await buscarComPrazo(`${API()}/secretaria/turmas`);
        if (!json.success) return;
        (json.data || []).forEach((t) => {
            const nome = t.nome || t.id;
            if (!nome) return;
            const opt = document.createElement('option');
            opt.value = nome;
            opt.textContent = t.totalAlunos != null ? `${nome} (${t.totalAlunos})` : nome;
            select.appendChild(opt);
        });
    } catch (e) {
        // Sem o seletor a página continua utilizável pela busca por nome, então
        // isto nunca vira erro de tela cheia — só um aviso no console.
        console.warn('[relatorios] não foi possível carregar as salas:', e.message);
    }
}

function recarregarRelatorios() {
    atualizarStatusDosFiltros();
    carregarAlunosPorTurma();
    carregarMatriculas();
}

function atualizarStatusDosFiltros() {
    const alvo = document.getElementById('filtroStatus');
    if (!alvo) return;
    const { q, turma } = filtrosAtuais();
    const partes = [];
    if (q) partes.push(`aluno "${q}"`);
    if (turma) partes.push(`sala ${turma}`);
    alvo.textContent = partes.length
        ? `Filtrando por ${partes.join(' · ')}. A exportação em CSV segue os mesmos filtros.`
        : '';
}

function switchTab(tab) {
    document.querySelectorAll('.sec-tab').forEach(t => t.classList.remove('active'));
    event.target.closest('.sec-tab').classList.add('active');
    document.getElementById('tabTurma').style.display = tab === 'turma' ? 'block' : 'none';
    document.getElementById('tabMatriculas').style.display = tab === 'matriculas' ? 'block' : 'none';
}

// ============================================================================
// CARREGAMENTO COM FIM GARANTIDO
// ============================================================================
// Os dois carregadores desta página tinham a mesma forma:
//
//     try { ... if (json.success) { pinta } } catch(e) { console.error(e) }
//
// Sem `finally`, sem timeout e sem ramo `else`. Qualquer falha — 403 de perfil,
// 500, rede caindo, ou só uma consulta lenta demais — deixava o texto
// "Carregando..." na tela PARA SEMPRE, com o erro só no console. Era esse o
// "spinner infinito" relatado.
//
// Agora todo fetch tem AbortController + 15s, e o estado final da tela é
// decidido no `finally`: dados, vazio, ou erro com botão de tentar de novo.
// Nunca "carregando".
// ============================================================================
const TIMEOUT_MS = 15000;

/**
 * fetch com prazo. O AbortController é o que realmente encerra a requisição —
 * um `Promise.race` com timer deixaria a conexão pendurada consumindo conexão
 * do navegador (limite de 6 por origem) mesmo depois de desistirmos dela.
 */
async function buscarComPrazo(url) {
    const controlador = new AbortController();
    const alarme = setTimeout(() => controlador.abort(), TIMEOUT_MS);
    try {
        const res = await fetch(url, { credentials: 'include', signal: controlador.signal });
        if (!res.ok) {
            const erro = new Error(mensagemDoStatus(res.status));
            erro.status = res.status;
            throw erro;
        }
        return await res.json();
    } catch (e) {
        if (e.name === 'AbortError') {
            throw new Error(`O servidor demorou mais de ${TIMEOUT_MS / 1000}s para responder.`);
        }
        throw e;
    } finally {
        clearTimeout(alarme);
    }
}

function mensagemDoStatus(status) {
    if (status === 401) return 'Sua sessão expirou. Entre novamente.';
    if (status === 403) return 'Seu perfil não tem acesso a este relatório.';
    if (status === 404) return 'Relatório indisponível nesta versão do sistema.';
    if (status >= 500) return 'O servidor falhou ao gerar o relatório.';
    return `Não foi possível carregar (HTTP ${status}).`;
}

/** Bloco de erro com retry. `aoTentar` é o nome de uma função global. */
function blocoErro(mensagem, aoTentar) {
    return `<div style="text-align:center;padding:2rem;color:#fca5a5;">
        <i class="bi bi-exclamation-triangle" style="font-size:1.5rem;display:block;margin-bottom:0.5rem;"></i>
        <div style="margin-bottom:1rem;">${escapar(mensagem)}</div>
        <button class="sec-btn sec-btn-outline" onclick="${aoTentar}()">
            <i class="bi bi-arrow-clockwise"></i> Tentar novamente
        </button>
    </div>`;
}

function blocoVazio(mensagem) {
    return `<div style="text-align:center;padding:2rem;color:#94a3b8;">
        <i class="bi bi-inbox" style="font-size:1.5rem;display:block;margin-bottom:0.5rem;"></i>
        ${escapar(mensagem)}
    </div>`;
}

/** A mensagem de erro pode conter texto vindo do servidor. */
function escapar(texto) {
    const d = document.createElement('div');
    d.textContent = String(texto == null ? '' : texto);
    return d.innerHTML;
}

async function carregarAlunosPorTurma() {
    const container = document.getElementById('turmaReportContent');
    container.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:2rem;">Carregando...</div>';

    try {
        const json = await buscarComPrazo(
            `${API()}/secretaria/relatorios/alunos-por-turma${queryDosFiltros()}`
        );
        if (!json.success) throw new Error(json.error || 'O servidor recusou o relatório.');

        // Turma sem nenhum aluno depois do filtro vira ruído: com "joao" na
        // busca, 29 cartões vazios enterram o único que interessa.
        const temFiltro = !!queryDosFiltros();
        const turmas = (json.data || []).filter((t) => !temFiltro || t.totalAlunos > 0);

        // Estado vazio é diferente de erro: "não há turmas" é uma resposta
        // correta, e mostrá-la como falha mandaria a secretaria procurar um
        // problema que não existe.
        if (!turmas.length) {
            container.innerHTML = blocoVazio(
                temFiltro
                    ? 'Nenhum aluno encontrado com estes filtros.'
                    : 'Nenhuma turma ativa cadastrada.'
            );
            return;
        }

        container.innerHTML = turmas.map(t => `
                <div class="sec-form-card">
                    <h3>
                        <i class="bi bi-people" style="color:${t.semTurmaCadastrada ? '#f59e0b' : '#0ea5e9'};"></i>
                        ${escapar(t.turma)}
                        <span class="sec-badge sec-badge-blue" style="margin-left:0.5rem;">${t.totalAlunos} alunos</span>
                        ${t.semTurmaCadastrada ? '<span class="sec-badge sec-badge-yellow" style="margin-left:0.25rem;">sala não cadastrada</span>' : ''}
                    </h3>
                    ${t.semTurmaCadastrada ? `<p style="color:#fbbf24;font-size:0.78rem;margin:0 0 0.75rem;">
                        Estes alunos têm a sala digitada na ficha, mas não há uma turma com esse nome no cadastro.
                        Eles apareciam em relatório nenhum até agora.
                    </p>` : ''}
                    ${t.alunos.length > 0 ? `<div style="overflow-x:auto;"><table class="sec-table">
                        <thead><tr><th>#</th><th>Nome</th><th>Matrícula</th></tr></thead>
                        <tbody>${t.alunos.map((a, i) => `<tr><td>${i+1}</td><td>${escapar(`${a.nome || ''}${a.sobrenome ? ' ' + a.sobrenome : ''}`)}</td><td>${escapar(a.matricula || '-')}</td></tr>`).join('')}</tbody>
                    </table></div>` : '<div style="color:#94a3b8;font-size:0.85rem;padding:0.5rem;">Nenhum aluno nesta turma</div>'}
                </div>
            `).join('');
    } catch (e) {
        console.error('[relatorios] alunos-por-turma:', e);
        container.innerHTML = blocoErro(e.message, 'carregarAlunosPorTurma');
    }
}

async function carregarMatriculas() {
    const resumoEl = document.getElementById('matResumo');
    const body = document.getElementById('matBody');
    body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#94a3b8;">Carregando...</td></tr>';

    try {
        const json = await buscarComPrazo(
            `${API()}/secretaria/relatorios/matriculas${queryDosFiltros()}`
        );
        if (!json.success) throw new Error(json.error || 'O servidor recusou o relatório.');
        {
            const r = json.data.resumo;
            resumoEl.innerHTML = `
                <div class="sec-summary-item"><div class="sec-summary-value">${r.total}</div><div class="sec-summary-label">Total</div></div>
                <div class="sec-summary-item"><div class="sec-summary-value" style="color:#10b981;">${r.cursando}</div><div class="sec-summary-label">Cursando</div></div>
                <div class="sec-summary-item"><div class="sec-summary-value" style="color:#3b82f6;">${r.aprovado}</div><div class="sec-summary-label">Aprovados</div></div>
                <div class="sec-summary-item"><div class="sec-summary-value" style="color:#ef4444;">${r.reprovado}</div><div class="sec-summary-label">Reprovados</div></div>
                <div class="sec-summary-item"><div class="sec-summary-value" style="color:#f59e0b;">${r.transferido}</div><div class="sec-summary-label">Transferidos</div></div>
                <div class="sec-summary-item"><div class="sec-summary-value" style="color:#94a3b8;">${r.evadido}</div><div class="sec-summary-label">Evadidos</div></div>
            `;
            const matriculas = json.data.matriculas || [];
            if (matriculas.length > 0) {
                const badgeMap = { cursando:'sec-badge-green', aprovado:'sec-badge-blue', reprovado:'sec-badge-red', transferido:'sec-badge-yellow', evadido:'sec-badge-gray' };
                body.innerHTML = matriculas.map(m => `<tr>
                    <td>${escapar(`${m.alunoNome || ''}${m.alunoSobrenome ? ' ' + m.alunoSobrenome : ''}`)}</td>
                    <td>${escapar(m.matriculaNumero || '-')}</td>
                    <td>${escapar(m.anoLetivo)}</td>
                    <td><span class="sec-badge ${badgeMap[m.status] || 'sec-badge-purple'}">${escapar(m.status)}</span></td>
                    <td>${m.dataMatricula ? new Date(m.dataMatricula).toLocaleDateString('pt-BR') : '-'}</td>
                </tr>`).join('');
            } else {
                // Sem matrícula no período é resultado válido, não falha.
                body.innerHTML = '<tr><td colspan="5">' + blocoVazio(
                    queryDosFiltros()
                        ? 'Nenhuma matrícula para estes filtros.'
                        : 'Nenhuma matrícula no período.'
                ) + '</td></tr>';
            }

            // O backend limita as LINHAS mas conta o resumo sobre a base
            // inteira. Sem este aviso, o total do resumo pareceria não bater
            // com a tabela e viraria um chamado de "número errado".
            const pag = json.data.paginacao;
            if (pag && pag.truncado) {
                body.insertAdjacentHTML('beforeend',
                    `<tr><td colspan="5" style="text-align:center;color:#94a3b8;font-size:0.85rem;padding:0.75rem;">
                        Exibindo as ${matriculas.length} matrículas mais recentes de ${pag.total}.
                        Use "Exportar Matrículas (CSV)" para a lista completa.
                    </td></tr>`);
            }
        }
    } catch (e) {
        console.error('[relatorios] matriculas:', e);
        resumoEl.innerHTML = '';
        body.innerHTML = '<tr><td colspan="5">' + blocoErro(e.message, 'carregarMatriculas') + '</td></tr>';
    }
}

function exportar(tipo) {
    // O CSV sai com os MESMOS filtros da tela. Baixar a base inteira enquanto a
    // tela mostra um recorte é como o arquivo deixa de bater com o que a
    // secretaria acabou de conferir.
    const url = `${API()}/secretaria/relatorios/exportar?tipo=${tipo}${queryDosFiltros('&')}`;
    window.open(url, '_blank');
    toast(queryDosFiltros() ? 'Download iniciado (com os filtros da tela).' : 'Download iniciado!');
}
