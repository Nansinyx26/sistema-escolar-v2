        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;

        .table-card {
            background: var(--surface-card);
            border-radius: var(--radius-lg);
            padding: 1rem;
            border: 1px solid var(--border-color);

        table {

            border-collapse: collapse;
        }

        td {

            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.875rem;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-delete {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            border: none;
            padding: 0.5rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.2);
        }

    <link rel="stylesheet" href="../../css/neo-brutal.css">

    <link rel="stylesheet" href="../../css/reactions.css?v=1.0">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Escola">
    <meta name="mobile-web-app-capable" content="yes">

<body>
    <!-- Splash Screen (PWA) -->
    <div id="splashScreen">
        <div class="splash-logo-container">
            <div class="splash-logo">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <div class="splash-logo-ring"></div>
        </div>
        <div class="splash-text">
            <h2 class="splash-title">Sistema Escolar</h2>
            <p class="splash-subtitle">Gerenciar Usuários</p>
        </div>
        <div class="splash-progress-container">
            <div class="splash-progress-track">
                <div class="splash-progress-bar"></div>
            </div>
            <div class="splash-progress-text">Inicializando sistema...</div>
        </div>
        <div class="splash-version">v3.0</div>
    </div>
    <script src="../../js/splash-screen.js"></script>

    <div class="dashboard-page">
        <header class="dashboard-header">
            <div class="header-content">
                <div class="header-left">
                    <button class="btn btn-secondary btn-sm" onclick="window.location.href='../dashboard.html'">
                        <i class="bi bi-arrow-left"></i> Voltar
                    </button>
                    <div class="header-logo">
                        <i class="bi bi-people-fill"></i>
                        <span>Gerenciar Usuários</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="container">
            <!-- Painel de Segurança (Código do Dia) -->
            <div class="glass-strong" style="margin-bottom: 2rem; padding: 1.2rem; border-radius: var(--radius-lg); border-left: 5px solid var(--primary-color);">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem;">
                    <!-- Lado Esquerdo: Título -->
                    <div style="flex: 1; min-width: 250px;">
                        <h3 style="margin: 0; font-size: 1.1rem; color: var(--primary-color); display: flex; align-items: center; gap: 0.5rem;">
                            <i class="bi bi-shield-lock"></i> Central de Segurança
                        </h3>
                        <p class="text-secondary text-sm" style="margin: 0.2rem 0 0;">Controle de acesso e códigos da escola.</p>
                    </div>

                    <!-- Centro: Código Secreto -->
                    <div style="display: flex; align-items: center; gap: 0.8rem;">
                        <div style="background: rgba(0,0,0,0.2); padding: 0.4rem 1rem; border-radius: var(--radius-md); border: 1px solid rgba(var(--primary-rgb), 0.2); display: flex; align-items: center; gap: 1rem;">
                            <div style="text-align: right;">
                                <span class="text-secondary" style="display: block; font-size: 0.65rem; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px;">Código Secreto do Dia</span>
                                <span id="dailyCodeDisplay" data-code="------" style="font-family: monospace; font-size: 1.4rem; font-weight: 700; color: var(--text-primary); letter-spacing: 2px;">••••••</span>
                            </div>
                            <button type="button" onclick="toggleSecretVisibility('dailyCodeDisplay', this)" class="btn-icon" style="color: var(--text-secondary); margin-top: 5px;">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        
                        <button id="btnRotateCode" class="btn btn-secondary btn-sm" onclick="rotateSecretCode()" title="Gerar Novo Código" style="display: none; height: 42px;">
                            <i class="bi bi-arrow-repeat"></i>
                        </button>
                    </div>

                    <!-- Lado Direito: Ações -->
                    <div style="display: flex; gap: 0.75rem;">
                        <button class="btn btn-primary btn-sm" onclick="openNewUserModal()" style="height: 42px;">
                            <i class="bi bi-person-plus-fill"></i> Novo Usuário
                        </button>
                        <button class="btn btn-secondary btn-sm" onclick="window.location.href='codigos-backup.html'" style="height: 42px;" title="Códigos de backup 2FA (tela cheia)">
                            <i class="bi bi-key"></i>
                        </button>
                        <button class="btn btn-secondary btn-sm" onclick="window.location.href='auditoria.html'" style="height: 42px;" title="Ver Logs de Auditoria">
                            <i class="bi bi-journal-text"></i> Auditoria
                        </button>
                    </div>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2 style="margin: 0; font-size: 1.25rem;">Lista de Usuários</h2>
            </div>
            
            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Perfil</th>
                            <th>Origem</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="usersTable">
                        <tr>
                            <td colspan="5">Carregando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <!-- ================================================================
             Modal: Códigos de Backup 2FA
             ================================================================
             Fica AQUI, e não numa página separada, porque a operação nasce da
             linha do usuário: quem administra já está olhando a lista e não
             deveria perder o contexto (nem a busca e os filtros aplicados)
             para gerar um código.

             Paleta black + mint restrita a este bloco, via #modalBackup, para
             não vazar cor para o resto da tela de usuários.
        -->
        <div id="modalBackup" class="backdrop" style="display: none; align-items: center; justify-content: center; z-index: 1000;">
            <div class="glass-strong" style="max-width: 560px; width: 92%; padding: 2rem; border-radius: var(--radius-lg); background: linear-gradient(180deg,#131a22,#0d1117); border: 1px solid rgba(52,224,161,.18);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: .4rem;">
                    <h3 style="margin: 0; display:flex; align-items:center; gap:.55rem;">
                        <i class="bi bi-key-fill" style="color:#34e0a1;"></i> Códigos de Backup 2FA
                    </h3>
                    <button class="btn-icon" onclick="fecharCodigosBackup()" aria-label="Fechar"><i class="bi bi-x-lg"></i></button>
                </div>
                <p id="backupConta" style="color:#8b98a5; font-size:.88rem; margin:0 0 1.2rem;"></p>

                <div id="backupCorpo"></div>
            </div>
        </div>

        <style>
            #modalBackup .mint-btn {
                padding:.6rem 1.15rem; border-radius:9px; border:1px solid transparent; cursor:pointer;
                font-size:.88rem; font-weight:700; background:#34e0a1; color:#04120c;
            }
            #modalBackup .mint-btn:hover:not(:disabled) { filter: brightness(1.12); }
            #modalBackup .mint-btn:disabled { opacity:.4; cursor:not-allowed; }
            #modalBackup .mint-btn.secundario {
                background:transparent; color:#7af0c4; border-color:rgba(52,224,161,.32);
            }
            #modalBackup .grade-codigos {
                display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
                gap:.55rem; margin:1rem 0;
            }
            #modalBackup .codigo {
                font-family:ui-monospace,Consolas,monospace; font-size:1.05rem; letter-spacing:.06em;
                text-align:center; font-weight:600; color:#7af0c4; background:rgba(52,224,161,.07);
                border:1px dashed rgba(52,224,161,.32); border-radius:9px; padding:.6rem .3rem;
                user-select:all;
            }
            #modalBackup .saldo { display:flex; gap:1.8rem; flex-wrap:wrap; margin:.4rem 0 1.2rem; }
            #modalBackup .saldo div { font-size:.72rem; color:#8b98a5; text-transform:uppercase; letter-spacing:.06em; }
            #modalBackup .saldo strong { display:block; font-size:1.7rem; color:#e6edf3; line-height:1.1; }
            #modalBackup .saldo div.destaque strong { color:#34e0a1; }
            #modalBackup .nota {
                border-left:3px solid #34e0a1; background:rgba(52,224,161,.07); color:#7af0c4;
                padding:.8rem 1rem; border-radius:0 9px 9px 0; font-size:.83rem; margin:1rem 0;
            }
            #modalBackup .nota.erro { border-color:#ff6b6b; background:rgba(255,107,107,.07); color:#ffb3b3; }
            @media print {
                body * { visibility: hidden; }
                #modalBackup, #modalBackup * { visibility: visible; }
                #modalBackup { position:absolute; inset:0; background:#fff !important; display:block !important; }
                #modalBackup .glass-strong { background:#fff !important; border-color:#bbb !important; }
                #modalBackup .codigo { color:#000 !important; background:#f2f2f2 !important; border-color:#666 !important; }
                #modalBackup .nao-imprimir { display:none !important; }
            }
        </style>

        <!-- Modal Novo Usuário -->
        <div id="newUserModal" class="backdrop" style="display: none; align-items: center; justify-content: center; z-index: 1000;">
            <div class="glass-strong" style="max-width: 500px; width: 90%; padding: 2rem; border-radius: var(--radius-lg);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h3 style="margin: 0;"><i class="bi bi-person-plus-fill"></i> Cadastrar Usuário</h3>
                    <button class="btn-icon" onclick="closeNewUserModal()"><i class="bi bi-x-lg"></i></button>
                </div>
                
                <form id="newUserForm">
                    <div class="form-group" style="margin-bottom: 1rem;">
                        <label>Nome Completo</label>
                        <input type="text" id="newUserName" class="form-control" placeholder="Ex: João Silva" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 1rem;">
                        <label>E-mail</label>
                        <input type="email" id="newUserEmail" class="form-control" placeholder="email@escola.com" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 1rem;">
                        <label>Senha Inicial</label>
                        <div style="position: relative;">
                            <input type="password" id="newUserPass" class="form-control" value="123456" required style="padding-right: 40px;">
                            <button type="button" onclick="togglePass('newUserPass', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-secondary); cursor: pointer;">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label>Perfil de Acesso</label>
                        <select id="newUserRole" class="form-control" required>
                            <option value="professor">Professor</option>
                            <option value="diretor">Diretor</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>
                    <div style="display: flex; gap: 1rem;">
                        <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="window.location.href='../login.html'">Cancelar</button>
                        <button type="submit" class="btn btn-primary" style="flex: 1;">Criar Conta</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script defer src="../../js/database.js"></script>
    <script defer src="../../js/auth.js"></script>
    <script defer src="../../js/utils.js"></script>
    <script>

        document.addEventListener('DOMContentLoaded', async () => {
            const usersTable = document.getElementById('usersTable');
            const newUserForm = document.getElementById('newUserForm');

            // Auth Check
            await auth.init();
            const user = auth.getCurrentUser();

            if (!user || (user.perfil !== 'admin' && user.perfil !== 'diretor')) {
                alert('Acesso negado. Esta página é restrita à Direção.');
                window.location.href = '../login.html';
                return;
            }

            // Controle de botões (Admin vs Diretor)
            if (user.perfil === 'admin' || user.perfil === 'diretor') {
                const btnRotate = document.getElementById('btnRotateCode');
                if (btnRotate) btnRotate.style.display = 'inline-flex';
            }

            // --- Segurança / Código do Dia ---
            async function fetchSecurityStatus() {
                try {
                    const res = await fetch(`${window.API_BASE_URL}/security/status`);
                    const json = await res.json();
                    if (json.success) {
                        const el = document.getElementById('dailyCodeDisplay');
                        el.setAttribute('data-code', json.data.codigo);
                        el.innerText = '••••••'; // Oculto por padrão
                    }
                } catch (e) {
                    console.error('Erro ao buscar código:', e);
                }
            }

            window.rotateSecretCode = async () => {
                if (!confirm('Deseja realmente gerar um novo código? O código atual deixará de funcionar imediatamente.')) return;
                
                const btnRotate = document.getElementById('btnRotateCode');
                const originalHtml = btnRotate ? btnRotate.innerHTML : '';
                
                try {
                    if (btnRotate) {
                        btnRotate.disabled = true;
                        btnRotate.innerHTML = '<i class="bi bi-arrow-repeat inline-block animate-spin"></i>';
                    }
                    
                    const res = await fetch(`${window.API_BASE_URL}/security/rotate`, {
                        method: 'POST'
                    });
                    const json = await res.json();
                    if (json.success && json.data) {
                        const el = document.getElementById('dailyCodeDisplay');
                        const toggleBtn = document.querySelector('button[onclick*="dailyCodeDisplay"]');
                        const icon = toggleBtn ? toggleBtn.querySelector('i') : null;
                        
                        el.setAttribute('data-code', json.data.codigo);
                        // Revela o código novo automaticamente para melhor UX
                        el.innerText = json.data.codigo;
                        if (icon) {
                            icon.classList.remove('bi-eye');
                            icon.classList.add('bi-eye-slash');
                        }
                        showToast('Novo código gerado com sucesso!', 'success');
                    } else {
                        throw new Error(json.error || 'Erro ao gerar');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('Erro ao rotacionar código', 'error');
                } finally {
                    if (btnRotate) {
                        btnRotate.disabled = false;
                        btnRotate.innerHTML = originalHtml;
                    }
                }
            };

            fetchSecurityStatus();

            // --- Modal Functions ---
            window.openNewUserModal = () => {
                document.getElementById('newUserModal').style.display = 'flex';
                document.getElementById('newUserName').focus();
            };

            window.closeNewUserModal = () => {
                document.getElementById('newUserModal').style.display = 'none';
                newUserForm.reset();
            };

            newUserForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;
                
                try {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Criando...';

                    const userData = {
                        nome: document.getElementById('newUserName').value,
                        email: document.getElementById('newUserEmail').value,
                        senha: document.getElementById('newUserPass').value,
                        perfil: document.getElementById('newUserRole').value,
                        ativo: true
                    };

                    const res = await fetch(`${window.API_BASE_URL}/usuarios`, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(userData)
                    });

                    const json = await res.json();
                    if (json.success) {
                        showToast('Usuário criado com sucesso!', 'success');
                        closeNewUserModal();
                        await loadUsers(); // Refresh instantâneo
                    } else {
                        throw new Error(json.error || 'Erro ao criar usuário');
                    }
                } catch (err) {
                    showToast(err.message, 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            });

            loadUsers();

            window.deleteUser = async (id, source, email) => {
                const msg = `Deseja realmente excluir ${email}?`;
                if (!confirm(msg)) return;

                try {
                    let success = false;
                    if (source === 'MongoDB') {
                        const res = await fetch(`${window.API_BASE_URL}/usuarios/${id}`, { 
                            method: 'DELETE'
                        });
                        const json = await res.json();
                        if (json.success) success = true;
                        else throw new Error(json.error);

                        // A cópia local do mesmo e-mail sobrevivia à exclusão no
                        // servidor: a linha voltava para a tabela como
                        // "IndexedDB" logo no refresh e o botão de migrar ainda
                        // permitia devolver a conta apagada para a nuvem.
                        if (success) await deleteFromIndexedDBByEmail(email);
                    } else if (source === 'IndexedDB') {
                        success = await deleteFromIndexedDB(id);
                    }

                    if (success) {
                        showToast('Usuário removido!', 'success');
                        await loadUsers(); // Refresh imediato
                    }
                } catch (e) {
                    showToast(e.message || 'Erro ao excluir', 'error');
                }
            };

            async function loadUsers() {
                usersTable.innerHTML = '<tr><td colspan="5" class="text-center">Sincronizando dados...</td></tr>';
                const allUsers = [];

                // 1. MongoDB
                try {
                    const res = await fetch(`${window.API_BASE_URL}/usuarios`);
                    const json = await res.json();
                    if (json.success) {
                        json.data.forEach(u => allUsers.push({ ...u, source: 'MongoDB', id: u._id || u.id }));
                    }
                } catch (e) { console.error('Erro Mongo:', e); }

                // 2. IndexedDB
                try {
                    const idbUsers = await getIndexedDBUsers();
                    idbUsers.forEach(u => {
                        const exists = allUsers.find(ex => ex.email === u.email && ex.source === 'MongoDB');
                        allUsers.push({ ...u, source: 'IndexedDB', id: u._id || u.id, isDuplicate: !!exists });
                    });
                } catch (e) { }

                // 3. LocalStorage — removido: sessão não vive mais em localStorage
                // (o JWT é cookie HttpOnly). O logout ainda limpa a chave legada
                // 'escola_session' em auth.js/api-config.js.

                window.allUsersCache = allUsers;
                renderTable(allUsers);
            }

            function renderTable(users) {
                if (users.length === 0) {
                    usersTable.innerHTML = '<tr><td colspan="5" class="text-center">Nenhum usuário encontrado.</td></tr>';
                    return;
                }

                usersTable.innerHTML = users.map(u => `
                    <tr style="${u.isDuplicate ? 'opacity: 0.6;' : ''}">
                        <td>${u.nome || 'Sem nome'} ${u.isDuplicate ? '<br><small>(Local/Duplicado)</small>' : ''}</td>
                        <td>${u.email}</td>
                        <td><span class="badge ${u.perfil === 'admin' ? 'badge-primary' : 'badge-secondary'}">${u.perfil || 'Indefinido'}</span></td>
                        <td><span class="badge ${u.source === 'MongoDB' ? 'badge-success' : 'badge-info'}">${u.source}</span></td>
                        <td class="actions">
                            ${(u.source !== 'MongoDB' && !u.isDuplicate) ? `
                                <button class="btn-icon" onclick="migrateUser('${u.id}', '${u.source}', '${u.email}')" title="Subir para Nuvem" style="color: var(--primary-color)">
                                    <i class="bi bi-cloud-upload-fill"></i>
                                </button>
                            ` : ''}
                            ${u.source === 'LocalStorage' ? `
                                <button class="btn-icon" onclick="deleteUser('${u.id}', '${u.source}', '${u.email}')" title="Limpar Sessão Local" style="color: var(--text-secondary)">
                                    <i class="bi bi-broom"></i>
                                </button>
                            ` : `
                                ${u.source === 'MongoDB' ? `
                                    <button class="btn-icon" onclick="anonymizeUser('${u.id}')" title="Anonimizar (LGPD)" style="color: var(--warning-color, #f59e0b)">
                                        <i class="bi bi-shield-lock"></i>
                                    </button>
                                ` : ''}
                                ${(u.source === 'MongoDB' && (['admin','diretor','secretaria'].indexOf(u.perfil) !== -1 || u.twoFactorEnabled)) ? `
                                    <button class="btn-icon" onclick="abrirCodigosBackup('${u.id}')" title="Códigos de backup 2FA" style="color: #34e0a1">
                                        <i class="bi bi-key-fill"></i>
                                    </button>
                                ` : ''}
                                <button class="btn-icon" onclick="deleteUser('${u.id}', '${u.source}', '${u.email}')" title="Excluir Permanentemente" style="color: #ef4444">
                                    <i class="bi bi-trash"></i>
                                </button>
                            `}
                        </td>
                    </tr>
                `).join('');
            }

            // ================================================================
            // CÓDIGOS DE BACKUP 2FA — tudo na própria página de usuários
            // ================================================================
            // Segundo fator que não depende de e-mail. Existe porque o 2FA de
            // diretor e secretaria dependia inteiramente da entrega de e-mail:
            // quando o provedor bloqueou o envio, os dois perfis ficaram
            // trancados fora do sistema sem caminho de volta.
            //
            // Os códigos NÃO ficam visíveis depois de gerados — no banco só
            // existe o hash scrypt. Por isso este modal trata o momento da
            // geração como o único em que eles existem legíveis: copiar e
            // imprimir estão ali, e a nota diz como entregar.

            let backupUsuarioId = null;

            const esc = (t) => {
                const d = document.createElement('div');
                d.textContent = String(t == null ? '' : t);
                return d.innerHTML;
            };

            window.abrirCodigosBackup = async (id) => {
                backupUsuarioId = id;
                const u = (window.allUsersCache || []).find(x => String(x.id) === String(id)) || {};

                document.getElementById('backupConta').textContent =
                    `${u.nome || 'Conta'} — ${u.perfil || '?'} — ${u.email || ''}`;
                document.getElementById('backupCorpo').innerHTML =
                    '<p style="color:#8b98a5;font-size:.85rem;">Consultando saldo…</p>';
                document.getElementById('modalBackup').style.display = 'flex';

                try {
                    const res = await fetch(`${window.API_BASE_URL}/admin/2fa/backup-codes/${encodeURIComponent(id)}`, { credentials: 'include' });
                    const d = await res.json();
                    if (!res.ok) throw new Error(d.erro || `HTTP ${res.status}`);
                    renderSaldoBackup(d);
                } catch (e) {
                    document.getElementById('backupCorpo').innerHTML =
                        `<div class="nota erro">${esc(e.message)}</div>` + botoesGerar();
                }
            };

            const botoesGerar = () => `
                <div class="nao-imprimir" style="display:flex;gap:.6rem;flex-wrap:wrap;">
                    <button type="button" class="mint-btn" onclick="gerarCodigosBackup()">Gerar 8 códigos</button>
                </div>`;

            function renderSaldoBackup(d) {
                const semLote = !d.total;
                document.getElementById('backupCorpo').innerHTML = `
                    <div class="saldo">
                        <div class="destaque"><strong>${d.disponiveis || 0}</strong>disponíveis</div>
                        <div><strong>${d.usados || 0}</strong>usados</div>
                        <div><strong>${d.total || 0}</strong>no lote</div>
                    </div>
                    ${semLote ? '<div class="nota">Esta conta ainda não tem códigos de backup.</div>' : ''}
                    ${d.sugestao ? `<div class="nota">${esc(d.sugestao)}</div>` : ''}
                    <p style="font-size:.82rem;color:#8b98a5;">
                        Gerar um lote novo <strong>invalida o anterior</strong> — os códigos
                        antigos param de funcionar na hora.
                    </p>
                    ${botoesGerar()}`;
            }

            window.gerarCodigosBackup = async () => {
                if (!backupUsuarioId) return;
                if (!confirm('Gerar 8 códigos novos?\n\nIsto INVALIDA os códigos anteriores desta conta.')) return;

                document.getElementById('backupCorpo').innerHTML =
                    '<p style="color:#8b98a5;font-size:.85rem;">Gerando…</p>';

                try {
                    const res = await fetch(`${window.API_BASE_URL}/admin/2fa/backup-codes/${encodeURIComponent(backupUsuarioId)}`, {
                        method: 'POST',
                        headers: window.csrfHeaders ? window.csrfHeaders(true) : { 'Content-Type': 'application/json' },
                        credentials: 'include'
                    });
                    const d = await res.json();
                    if (!d.ok) throw new Error(d.erro || 'Não foi possível gerar os códigos.');

                    document.getElementById('backupCorpo').innerHTML = `
                        <div class="nota">${esc(d.aviso)}</div>
                        <div class="grade-codigos">
                            ${d.codigos.map(c => `<div class="codigo">${esc(c)}</div>`).join('')}
                        </div>
                        <div class="nao-imprimir" style="display:flex;gap:.6rem;flex-wrap:wrap;">
                            <button type="button" class="mint-btn secundario" onclick="copiarCodigosBackup(this)">Copiar todos</button>
                            <button type="button" class="mint-btn secundario" onclick="window.print()">Imprimir</button>
                            <button type="button" class="mint-btn" onclick="fecharCodigosBackup()">Concluir</button>
                        </div>`;

                    // Guardado só em memória, para o botão de copiar. Sai da
                    // página junto com o modal — nada vai para storage.
                    window.__codigosBackupTemp = { nome: d.usuario.nome, codigos: d.codigos };
                } catch (e) {
                    document.getElementById('backupCorpo').innerHTML =
                        `<div class="nota erro">${esc(e.message)}</div>` + botoesGerar();
                }
            };

            window.copiarCodigosBackup = (btn) => {
                const t = window.__codigosBackupTemp;
                if (!t) return;
                const texto = `Códigos de backup — ${t.nome}\n\n${t.codigos.join('\n')}\n\nCada código funciona UMA vez.`;
                navigator.clipboard.writeText(texto)
                    .then(() => { btn.textContent = 'Copiado!'; })
                    .catch(() => alert('Não foi possível copiar. Selecione os códigos manualmente.'));
            };

            window.fecharCodigosBackup = () => {
                document.getElementById('modalBackup').style.display = 'none';
                document.getElementById('backupCorpo').innerHTML = '';
                // Os códigos saem da memória ao fechar: não há razão para
                // mantê-los acessíveis depois que a entrega foi feita.
                delete window.__codigosBackupTemp;
                backupUsuarioId = null;
            };

            window.anonymizeUser = async (id) => {
                if (!confirm('Tem certeza que deseja ANONIMIZAR este usuário? Todos os dados pessoais (CPF, Telefone, E-mail) serão removidos permanentemente para cumprir a LGPD, mas o registro histórico será mantido.')) return;

                try {
                    const response = await fetch(`${window.API_BASE_URL}/usuarios/${id}/anonymize`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });

                    const json = await response.json();
                    if (json.success) {
                        showToast('Usuário anonimizado com sucesso!', 'success');
                        loadUsers(); // Recarrega a lista
                    } else {
                        showToast(json.error || 'Erro ao anonimizar', 'error');
                    }
                } catch (err) {
                    showToast('Erro na conexão', 'error');
                }
            };

            window.migrateUser = async (id, source, email) => {
                const user = window.allUsersCache.find(u => u.id === id && u.source === source);
                if (!user || !confirm(`Subir ${email} para a nuvem?`)) return;

                try {
                    const res = await fetch(`${window.API_BASE_URL}/usuarios`, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ ...user, id: undefined, _id: undefined, source: undefined, isDuplicate: undefined, ativo: true })
                    });

                    const json = await res.json();
                    if (json.success) {
                        showToast('Usuário migrado!', 'success');
                        await loadUsers();
                    } else throw new Error(json.error);
                } catch (e) { showToast(e.message, 'error'); }
            };

            // --- Helpers IndexedDB ---
            function getIndexedDBUsers() {
                return new Promise((resolve) => {
                    const req = indexedDB.open('escolaDB');
                    req.onerror = () => resolve([]);
                    req.onsuccess = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('usuarios')) {
                            resolve([]);
                            return;
                        }
                        const tx = db.transaction(['usuarios'], 'readonly');
                        const store = tx.objectStore('usuarios');
                        const reqAll = store.getAll();
                        reqAll.onsuccess = () => resolve(reqAll.result);
                        reqAll.onerror = () => resolve([]);
                    };
                    req.onupgradeneeded = (e) => e.target.transaction.abort();
                });
            }

            // Remove pelo e-mail, não pela chave: a cópia local de uma conta
            // do MongoDB tem id próprio, então só o e-mail liga as duas.
            async function deleteFromIndexedDBByEmail(email) {
                const alvo = String(email || '').toLowerCase();
                if (!alvo) return;
                try {
                    const locais = await getIndexedDBUsers();
                    for (const u of locais) {
                        if (String(u.email || '').toLowerCase() !== alvo) continue;
                        await deleteFromIndexedDB(u._id || u.id).catch(() => {});
                    }
                } catch (e) {
                    console.error('Falha ao limpar cópia local:', e);
                }
            }

            function deleteFromIndexedDB(id) {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open('escolaDB');
                    req.onsuccess = (e) => {
                        const db = e.target.result;
                        const tx = db.transaction(['usuarios'], 'readwrite');
                        const store = tx.objectStore('usuarios');
                        const del = store.delete(id); // Use key provided
                        del.onsuccess = () => resolve(true);
                        del.onerror = () => reject('Erro ao deletar do IDB');
                    };
                    req.onerror = () => reject('Erro ao abrir IDB');
                });
            }
        });
    </script>
