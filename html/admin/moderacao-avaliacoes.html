<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
    <!-- Trava de acesso por perfil. SEM defer e antes de tudo: a decisao
         precisa acontecer antes do primeiro pixel. Ver js/guarda-acesso.js. -->
    <script src="/js/guarda-acesso.js?v=1.0"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Moderação de Avaliações - Admin</title>
    <!-- CSS -->
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/components-new.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <!-- Preload da fonte: sem ele o .woff2 só é descoberto depois do CSS. -->
    <link rel="preload" href="../../js/libs/fonts/bootstrap-icons.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../../js/libs/bootstrap-icons.min.css">
    <style>
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .kpi-card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .kpi-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .kpi-icon.blue { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .kpi-icon.yellow { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .kpi-icon.green { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .kpi-icon.red { background: rgba(239, 68, 68, 0.15); color: #ef4444; }

        .kpi-num {
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1.1;
        }

        .kpi-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .audit-card {
            background: var(--surface-card);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        .audit-table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-item {
            flex: 1;
            min-width: 180px;
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-yellow { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .badge-blue { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .badge-green { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .badge-red { background: rgba(239, 68, 68, 0.15); color: #ef4444; }

        .prazo-urgente {
            color: #ef4444;
            font-weight: 700;
        }

        .prazo-alerta {
            color: #f59e0b;
            font-weight: 600;
        }

        .prazo-ok {
            color: var(--text-secondary);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0.5rem 0 1rem 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .history-item {
            font-size: 0.82rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
        }
    </style>
    <!-- Offline Compiled Tailwind CSS -->
    <link rel="stylesheet" href="../../css/tailwind-built.css">
    <link rel="stylesheet" href="../../css/responsive-global.css?v=1.2">
    <link rel="stylesheet" href="../../css/splash-screen.css?v=1.0">
    <link rel="stylesheet" href="../../css/reactions.css?v=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon-180.png">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Escola">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="../../css/system-global.css?v=1.0">
    <!-- Rolagem e performance mobile — deve ser o ÚLTIMO stylesheet -->
    <link rel="stylesheet" href="../../css/mobile-scroll.css?v=1.0">
    <link rel="stylesheet" href="../../css/motion.css">
    <script src="../../js/scroll-lock.js?v=1.0"></script>
    <link rel="stylesheet" href="../../css/acessibilidade.css">
    <link rel="stylesheet" href="/css/botao-voltar.css">
</head>

<body>
    <div class="dashboard-page">
        <header class="dashboard-header">
            <div class="header-content">
                <div class="header-left">
                    <button type="button" class="btn-voltar-global" data-fallback="/html/dashboard.html" aria-label="Voltar para a página anterior">
                        <i class="bi bi-arrow-left"></i>
                        <span>Voltar</span>
                    </button>
                    <div class="header-logo">
                        <i class="bi bi-star-half"></i>
                        <span>Moderação de Avaliações</span>
                    </div>
                </div>
                <div class="header-right">
                    <button type="button" class="btn btn-primary btn-sm" id="btnAtualizarModeracao">
                        <i class="bi bi-arrow-clockwise"></i> Atualizar
                    </button>
                </div>
            </div>
        </header>

        <main class="container">
            <div class="audit-card">
                <p class="text-sm text-secondary" style="margin-bottom:1rem;">
                    A página inicial mostra só a avaliação que a pessoa autorizou publicar e que foi aprovada aqui.
                    Quem avaliou aparece pelas iniciais, sem foto. Editar o texto devolve a avaliação para esta fila.
                </p>
                <div class="filter-bar">
                    <div class="filter-item">
                        <label class="text-sm text-secondary" for="filtroSituacao">Situação</label>
                        <select id="filtroSituacao" class="form-control">
                            <option value="pendente">Aguardando revisão</option>
                            <option value="aprovada">Aprovadas</option>
                            <option value="recusada">Recusadas</option>
                        </select>
                    </div>
                </div>

                <div class="audit-table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Quem</th>
                                <th>Nota</th>
                                <th>Texto</th>
                                <th>Autorizou publicar</th>
                                <th>Data</th>
                                <th>Decisão</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaModeracaoBody">
                            <tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-secondary);">Carregando avaliações...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script defer src="/js/botao-voltar.js"></script>
    <script src="../../js/api-config.js"></script>
    <script src="../../js/admin-moderacao-avaliacoes.js"></script>
</body>

</html>
